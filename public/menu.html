<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Club – Menu</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:#0b0f1a;color:#e0e0e0;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .menu-container{text-align:center;max-width:480px;width:90%}
  .logo{font-size:2.4rem;font-weight:700;margin-bottom:.25rem;background:linear-gradient(135deg,#6366f1,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .subtitle{color:#94a3b8;font-size:.95rem;margin-bottom:2.5rem}
  .menu-grid{display:flex;flex-direction:column;gap:1rem}
  .menu-card{display:flex;align-items:center;gap:1.2rem;padding:1.25rem 1.5rem;border-radius:14px;background:#141929;border:1px solid #1e2640;text-decoration:none;color:#e0e0e0;transition:all .2s ease}
  .menu-card:hover{background:#1a2138;border-color:#334155;transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .menu-icon{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0}
  .menu-icon.ig{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
  .menu-icon.li{background:#0077b5}
  .menu-text h3{font-size:1.1rem;font-weight:600;margin-bottom:.2rem}
  .menu-text p{font-size:.82rem;color:#94a3b8}
  .logout-row{margin-top:2.5rem}
  .logout-btn{background:transparent;border:1px solid #334155;color:#94a3b8;padding:.6rem 1.6rem;border-radius:8px;cursor:pointer;font-size:.85rem;transition:all .2s}
  .logout-btn:hover{border-color:#ef4444;color:#ef4444}
</style>
</head>
<body>
  <div class="menu-container">
    <div class="logo">Finance Club Leipzig</div>
    <p class="subtitle">Social Media Dashboard</p>

    <div class="menu-grid">
      <a class="menu-card" href="/index.html?platform=instagram">
        <div class="menu-icon ig">📸</div>
        <div class="menu-text">
          <h3>Instagram Dashboard</h3>
          <p>Followers, engagement, post analytics</p>
        </div>
      </a>
      <a class="menu-card" href="/index.html?platform=linkedin">
        <div class="menu-icon li">💼</div>
        <div class="menu-text">
          <h3>LinkedIn Dashboard</h3>
          <p>Company page, reach, post performance</p>
        </div>
      </a>
    </div>

    <div class="logout-row">
      <form method="POST" action="/logout" style="display:inline">
        <button class="logout-btn" type="submit">Log out</button>
      </form>
    </div>
  </div>
</body>
</html>
