<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Finance Club Leipzig – EasyVerein Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root{--bg:#080b12;--surface:#111827;--surface-2:#1e293b;--border:rgba(148,163,184,.08);--border-2:rgba(148,163,184,.12);--text:#f1f5f9;--text-2:#94a3b8;--text-3:#64748b;--emerald:#10b981;--emerald-dim:rgba(16,185,129,.12)}

    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Nunito Sans',system-ui,sans-serif;font-weight:400;background:var(--bg);color:var(--text);
      background-image:
        linear-gradient(var(--border) 1px,transparent 1px),
        linear-gradient(90deg,var(--border) 1px,transparent 1px),
        radial-gradient(ellipse 60% 40% at 50% 0%,rgba(16,185,129,.07) 0%,transparent 70%);
      background-size:64px 64px,64px 64px,100% 100%;
      min-height:100vh}

    /* ── Header ── */
    header{background:var(--surface);border-bottom:1px solid var(--border-2);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
    .header-left{display:flex;align-items:center;gap:14px}
    header h1{font-family:'Syne',sans-serif;font-weight:700;font-size:1.25rem;display:flex;align-items:center;gap:10px;color:var(--text)}
    header h1 .icon-accent{color:var(--emerald)}
    .right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    #lastFetch{font-size:.75rem;color:var(--text-3);font-family:'Nunito Sans',sans-serif}
    .btn-back{padding:7px 14px;background:transparent;color:var(--text-2);border:1px solid var(--border-2);border-radius:8px;font-size:.78rem;text-decoration:none;transition:all .2s;display:inline-flex;align-items:center;gap:6px;font-family:'Nunito Sans',sans-serif;font-weight:500}
    .btn-back:hover{background:var(--surface-2);color:var(--text)}
    .btn-logout{padding:7px 14px;background:transparent;color:var(--text-3);border:1px solid var(--border-2);border-radius:8px;cursor:pointer;font-size:.78rem;font-family:'Nunito Sans',sans-serif;font-weight:500;transition:all .2s}
    .btn-logout:hover{background:var(--surface-2);color:var(--text)}
    .source-badge{font-size:.68rem;background:var(--emerald-dim);color:var(--emerald);padding:3px 10px;border-radius:20px;font-family:'JetBrains Mono',monospace;font-weight:400;display:inline-flex;align-items:center;gap:5px}

    /* ── Main ── */
    main{padding:32px;max-width:1320px;margin:0 auto}

    /* ── Section Titles ── */
    .section-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1.05rem;margin:32px 0 16px;color:var(--text);display:flex;align-items:center;gap:8px;letter-spacing:.01em}
    .section-title svg{color:var(--emerald);flex-shrink:0}

    /* ── KPI Cards ── */
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
    .kpi-card{background:var(--surface);border:1px solid var(--border-2);border-radius:16px;padding:24px 20px;box-shadow:0 2px 12px rgba(0,0,0,.2);text-align:center;position:relative;overflow:hidden;opacity:0;animation:fadeUp .5s ease forwards}
    .kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,var(--emerald))}
    .kpi-card .label{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin-bottom:8px;font-family:'Nunito Sans',sans-serif;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px}
    .kpi-card .label svg{opacity:.7}
    .kpi-card .value{font-family:'JetBrains Mono',monospace;font-size:1.9rem;font-weight:500;color:var(--accent,var(--emerald))}
    .kpi-card .sub{font-size:.72rem;color:var(--text-3);margin-top:6px;font-family:'Nunito Sans',sans-serif}
    .kpi-card .change{font-size:.72rem;margin-top:8px;font-weight:600;font-family:'JetBrains Mono',monospace;display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px}
    .change.up{color:#10b981;background:rgba(16,185,129,.1)}
    .change.down{color:#ef4444;background:rgba(239,68,68,.1)}
    .change.flat{color:var(--text-3);background:var(--surface-2)}

    /* ── Charts ── */
    .charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:20px;margin-bottom:32px}
    .chart-card{background:var(--surface);border:1px solid var(--border-2);border-radius:16px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.2);opacity:0;animation:fadeUp .5s ease forwards}
    .chart-card h3{font-family:'Syne',sans-serif;font-weight:700;font-size:.92rem;margin-bottom:16px;color:var(--text-2);display:flex;align-items:center;gap:7px}
    .chart-card h3 svg{color:var(--emerald);flex-shrink:0}
    .chart-card .na-msg{color:var(--text-3);font-size:.85rem;text-align:center;padding:40px 0;font-family:'Nunito Sans',sans-serif}

    /* ── Member Groups ── */
    .groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:32px}
    .group-card{background:var(--surface);border:1px solid var(--border-2);border-radius:14px;padding:18px 20px;box-shadow:0 2px 12px rgba(0,0,0,.2);display:flex;justify-content:space-between;align-items:center;opacity:0;animation:fadeUp .5s ease forwards;transition:border-color .2s}
    .group-card:hover{border-color:rgba(16,185,129,.25)}
    .group-card .gname{font-size:.88rem;font-weight:600;color:var(--text-2);font-family:'Nunito Sans',sans-serif}
    .group-card .gcount{font-family:'JetBrains Mono',monospace;font-size:1.35rem;font-weight:500;color:var(--emerald)}

    /* ── Inventory Table ── */
    .inventory-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--border-2);border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.2);margin-bottom:32px}
    .inventory-table th{background:var(--surface-2);text-align:left;padding:14px 18px;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);border-bottom:1px solid var(--border-2);font-family:'Nunito Sans',sans-serif;font-weight:600}
    .inventory-table td{padding:14px 18px;font-size:.88rem;border-bottom:1px solid var(--border);color:var(--text-2);font-family:'Nunito Sans',sans-serif}
    .inventory-table tr:last-child td{border-bottom:none}
    .stock-bar{height:7px;border-radius:4px;background:var(--surface-2);position:relative;min-width:80px}
    .stock-bar .fill{height:100%;border-radius:4px;background:var(--emerald);transition:width .6s ease}
    .stock-low .fill{background:#ef4444}
    .stock-mid .fill{background:#f59e0b}

    /* ── Utility ── */
    .loading{text-align:center;padding:80px;color:var(--text-3);font-size:1rem;font-family:'Nunito Sans',sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px}
    .loading svg{color:var(--emerald);animation:spin 1.2s linear infinite}
    .err{background:rgba(239,68,68,.08);color:#f87171;border:1px solid rgba(239,68,68,.15);border-radius:12px;padding:18px;margin:20px 0;font-family:'Nunito Sans',sans-serif;display:flex;align-items:center;gap:8px}

    /* ── Animations ── */
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

    /* ── Stagger delays ── */
    .kpi-card:nth-child(1){animation-delay:.05s}
    .kpi-card:nth-child(2){animation-delay:.1s}
    .kpi-card:nth-child(3){animation-delay:.15s}
    .kpi-card:nth-child(4){animation-delay:.2s}
    .chart-card:nth-child(1){animation-delay:.15s}
    .chart-card:nth-child(2){animation-delay:.2s}
    .chart-card:nth-child(3){animation-delay:.25s}
    .chart-card:nth-child(4){animation-delay:.3s}
    .chart-card:nth-child(5){animation-delay:.35s}
    .group-card:nth-child(1){animation-delay:.1s}
    .group-card:nth-child(2){animation-delay:.15s}
    .group-card:nth-child(3){animation-delay:.2s}
    .group-card:nth-child(4){animation-delay:.25s}
    .group-card:nth-child(5){animation-delay:.3s}
    .group-card:nth-child(6){animation-delay:.35s}

    /* ── Responsive ── */
    @media(max-width:600px){
      header{padding:14px 16px}
      main{padding:16px}
      .charts-grid{grid-template-columns:1fr}
      .kpi-grid{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>
<body>
<header>
  <div class="header-left">
    <a href="/" class="btn-back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg> Menu</a>
    <h1><span class="icon-accent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> EasyVerein Dashboard</h1>
  </div>
  <div class="right">
    <span id="lastFetch">Loading...</span>
    <span id="sourceBadge" class="source-badge"></span>
    <form method="POST" action="/logout" style="margin:0">
      <button class="btn-logout" type="submit">Logout</button>
    </form>
  </div>
</header>
<main id="app"><div class="loading"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Loading EasyVerein data...</div></main>
<script>
function fmt(n){if(n==null||n===0)return'\u2014';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n)}
function eur(n){if(n==null)return'\u2014';return n.toLocaleString('de-DE',{style:'currency',currency:'EUR'})}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

function timeData(ins,name){
  var m=(ins||[]).find(function(i){return i.name===name});
  if(!m)return null;
  var v=m.values||[];
  if(v.length===0)return null;
  return{
    labels:v.map(function(x){return new Date(x.end_time).toLocaleDateString('de-DE',{day:'2-digit',month:'short'})}),
    data:v.map(function(x){return x.value||0})
  };
}

function makeChart(id,label,td,color,wholeNumbers){
  var el=document.getElementById(id);if(!el)return;
  if(!td){el.style.display='none';var p=document.createElement('div');p.className='na-msg';p.textContent='Not enough data yet \u2014 keep refreshing daily!';el.parentElement.appendChild(p);return;}
  new Chart(el,{type:'line',data:{labels:td.labels,datasets:[{label:label,data:td.data,borderColor:color,backgroundColor:color+'22',fill:true,tension:.35,pointRadius:2,borderWidth:2}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:10,font:{size:11},color:'#64748b'}},y:{beginAtZero:false,grid:{color:'rgba(148,163,184,.06)'},ticks:{font:{size:11},color:'#64748b',precision:wholeNumbers?0:undefined}}}}});
}

function makeBarChart(id,label,labels,data,color){
  var el=document.getElementById(id);if(!el)return;
  new Chart(el,{type:'bar',data:{labels:labels,datasets:[{label:label,data:data,backgroundColor:color+'88',borderColor:color,borderWidth:1,borderRadius:6}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:10},color:'#64748b'}},y:{beginAtZero:true,grid:{color:'rgba(148,163,184,.06)'},ticks:{color:'#64748b'}}}}});
}

function makeDoubleBarChart(id,label1,label2,labels,data1,data2,color1,color2){
  var el=document.getElementById(id);if(!el)return;
  new Chart(el,{type:'bar',data:{labels:labels,datasets:[
    {label:label1,data:data1,backgroundColor:color1+'88',borderColor:color1,borderWidth:1,borderRadius:6},
    {label:label2,data:data2,backgroundColor:color2+'88',borderColor:color2,borderWidth:1,borderRadius:6}
  ]},options:{responsive:true,plugins:{legend:{position:'top',labels:{font:{size:11},color:'#94a3b8'}}},scales:{x:{grid:{display:false},ticks:{font:{size:10},color:'#64748b'}},y:{beginAtZero:true,grid:{color:'rgba(148,163,184,.06)'},ticks:{color:'#64748b'}}}}});
}

function makePieChart(id,labels,data,colors){
  var el=document.getElementById(id);if(!el)return;
  if(!data||data.length===0||data.every(function(v){return v===0})){el.style.display='none';var p=document.createElement('div');p.className='na-msg';p.textContent='No data available.';el.parentElement.appendChild(p);return;}
  new Chart(el,{type:'doughnut',data:{labels:labels,datasets:[{data:data,backgroundColor:colors,borderWidth:2,borderColor:'#111827',hoverOffset:6}]},options:{responsive:true,plugins:{legend:{position:'right',labels:{font:{size:12},color:'#94a3b8',padding:10}}}}});
}

/* ── SVG icon helpers ── */
var SVG_USERS='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>';
var SVG_USER_PLUS='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>';
var SVG_FILE_TEXT='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>';
var SVG_USER_X='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="18" y1="8" x2="23" y2="13"/><line x1="23" y1="8" x2="18" y2="13"/></svg>';
var SVG_WALLET='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>';
var SVG_ALERT='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
var SVG_CHECK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
var SVG_CHART_BAR='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>';
var SVG_CHART_LINE='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>';
var SVG_TRENDING='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>';
var SVG_TARGET='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>';
var SVG_LIST='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>';
var SVG_PACKAGE='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>';

function render(d){
  var org=d.organization||{},members=d.members||{},inv=d.invoices||{},inventory=d.inventory||[],cm=d.calculated_metrics||{},insights=d.insights,lastFetch=d.lastFetch,source=d.source;

  document.getElementById('lastFetch').textContent='Updated: '+new Date(lastFetch).toLocaleString('de-DE');
  document.getElementById('sourceBadge').textContent=source==='easyverein-api'?'EasyVerein API':'';

  /* member change from history */
  var mcData=timeData(insights,'total_members');
  var memberChange='';
  if(mcData&&mcData.data.length>=2){
    var diff=mcData.data[mcData.data.length-1]-mcData.data[0];
    var cls=diff>0?'up':diff<0?'down':'flat';
    var sign=diff>0?'+':'';
    memberChange='<div class="change '+cls+'">'+SVG_TRENDING+' '+sign+diff+' since tracking started</div>';
  }

  var html='';

  /* ── KPI Cards: Members ── */
  html+='<div class="section-title">'+SVG_USERS+' Members</div>';
  html+='<div class="kpi-grid">';
  html+='<div class="kpi-card" style="--accent:#10b981"><div class="label">'+SVG_USERS+' Active Members</div><div class="value">'+fmt(members.total)+'</div><div class="sub">Total active</div>'+memberChange+'</div>';
  html+='<div class="kpi-card" style="--accent:#3b82f6"><div class="label">'+SVG_USER_PLUS+' New (30 days)</div><div class="value">'+fmt(members.new_last_30_days)+'</div><div class="sub">Joined recently</div></div>';
  html+='<div class="kpi-card" style="--accent:#f59e0b"><div class="label">'+SVG_FILE_TEXT+' Applications</div><div class="value">'+fmt(members.applications)+'</div><div class="sub">Pending</div></div>';
  html+='<div class="kpi-card" style="--accent:#ef4444"><div class="label">'+SVG_USER_X+' Resigned</div><div class="value">'+fmt(members.resigned)+'</div><div class="sub">All time</div></div>';
  html+='</div>';

  /* ── KPI Cards: Finances ── */
  html+='<div class="section-title">'+SVG_WALLET+' Finances</div>';
  html+='<div class="kpi-grid">';
  html+='<div class="kpi-card" style="--accent:#10b981"><div class="label">'+SVG_WALLET+' Total Revenue</div><div class="value">'+eur(inv.total_revenue)+'</div><div class="sub">From paid invoices</div></div>';
  html+='<div class="kpi-card" style="--accent:#f59e0b"><div class="label">'+SVG_ALERT+' Open Invoices</div><div class="value">'+fmt(inv.open_count)+'</div><div class="sub">'+eur(inv.open_amount)+'</div></div>';
  html+='<div class="kpi-card" style="--accent:#ef4444"><div class="label">'+SVG_ALERT+' Overdue</div><div class="value">'+fmt(inv.overdue_count)+'</div><div class="sub">'+eur(inv.overdue_amount)+'</div></div>';
  html+='<div class="kpi-card" style="--accent:#3b82f6"><div class="label">'+SVG_CHECK+' Paid Invoices</div><div class="value">'+fmt(inv.paid_count)+'</div><div class="sub">Completed</div></div>';
  html+='</div>';

  /* ── Charts ── */
  html+='<div class="charts-grid">';
  html+='<div class="chart-card"><h3>'+SVG_CHART_LINE+' Member Count Over Time</h3><canvas id="cMembers"></canvas></div>';
  html+='<div class="chart-card"><h3>'+SVG_CHART_BAR+' Monthly Revenue</h3><canvas id="cRevenue"></canvas></div>';
  html+='<div class="chart-card"><h3>'+SVG_CHART_BAR+' Income vs Expenses</h3><canvas id="cIncomeExpenses"></canvas></div>';
  html+='<div class="chart-card"><h3>'+SVG_TRENDING+' Open Invoices Over Time</h3><canvas id="cOpenInv"></canvas></div>';
  html+='<div class="chart-card"><h3>'+SVG_TARGET+' Invoice Status</h3><canvas id="cInvStatus"></canvas></div>';
  html+='</div>';

  /* ── Member Groups ── */
  var groups=members.groups||[];
  if(groups.length>0){
    html+='<div class="section-title">'+SVG_LIST+' Member Groups</div>';
    html+='<div class="groups-grid">';
    groups.forEach(function(g){
      html+='<div class="group-card"><span class="gname">'+esc(g.name)+'</span><span class="gcount">'+fmt(g.memberCount)+'</span></div>';
    });
    html+='</div>';
  }

  /* ── Inventory Table ── */
  if(inventory.length>0){
    html+='<div class="section-title">'+SVG_PACKAGE+' Inventory</div>';
    html+='<table class="inventory-table"><thead><tr><th>Item</th><th>Current Stock</th><th>Total Stock</th><th>Availability</th></tr></thead><tbody>';
    inventory.forEach(function(item){
      var pct=item.totalStock>0?Math.round(item.currentStock/item.totalStock*100):0;
      var cls=pct<25?'stock-low':pct<60?'stock-mid':'';
      html+='<tr><td>'+esc(item.name)+'</td><td>'+fmt(item.currentStock)+'</td><td>'+fmt(item.totalStock)+'</td>';
      html+='<td><div class="stock-bar '+cls+'"><div class="fill" style="width:'+pct+'%"></div></div></td></tr>';
    });
    html+='</tbody></table>';
  }

  document.getElementById('app').innerHTML=html;

  /* ── Render Charts ── */
  makeChart('cMembers','Members',mcData,'#10b981',true);
  makeChart('cOpenInv','Open Invoices',timeData(insights,'open_invoices'),'#ef4444',true);

  /* Monthly revenue bar */
  var mr=inv.monthly_revenue||[];
  if(mr.length>0){
    makeBarChart('cRevenue','Revenue',mr.map(function(m){return m.label}),mr.map(function(m){return m.value}),'#10b981');
  }

  /* Income vs Expenses */
  var mi=inv.monthly_income||[];
  var me=inv.monthly_expenses||[];
  if(mi.length>0){
    makeDoubleBarChart('cIncomeExpenses','Income','Expenses',
      mi.map(function(m){return m.label}),
      mi.map(function(m){return m.value}),
      me.map(function(m){return m.value}),
      '#10b981','#ef4444');
  }

  /* Invoice status pie */
  var invLabels=['Paid','Open','Overdue'];
  var invData=[inv.paid_count||0,Math.max(0,(inv.open_count||0)-(inv.overdue_count||0)),inv.overdue_count||0];
  makePieChart('cInvStatus',invLabels,invData,['#10b981','#f59e0b','#ef4444']);
}

async function loadData(){
  try{var r=await fetch('/api/easyverein/kpis');if(!r.ok)throw new Error('HTTP '+r.status);render(await r.json())}
  catch(e){document.getElementById('app').innerHTML='<div class="err">'+SVG_ALERT+' '+e.message+'</div>'}
}

loadData();
</script>
</body>
</html>
