<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Finance Club Leipzig – LinkedIn Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f2f5;color:#1a1a2e}
    header{background:linear-gradient(135deg,#003049,#0a66c2,#0077b5);color:#fff;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
    header h1{font-size:1.3rem}
    .right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    #lastFetch{font-size:.8rem;opacity:.7}
    .btn-back{padding:8px 16px;background:transparent;color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.3);border-radius:8px;font-size:.8rem;text-decoration:none;transition:all .2s}
    .btn-back:hover{background:rgba(255,255,255,.1)}
    .btn-logout{padding:8px 16px;background:transparent;color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.2);border-radius:8px;cursor:pointer;font-size:.8rem}
    .source-badge{font-size:.7rem;background:rgba(255,255,255,.15);padding:3px 10px;border-radius:20px}
    main{padding:32px;max-width:1280px;margin:0 auto}

    .profile-card{background:#fff;border-radius:14px;padding:24px 28px;display:flex;align-items:center;gap:20px;margin-bottom:28px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
    .profile-card img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #0a66c2}
    .profile-card .info h2{font-size:1.2rem}
    .profile-card .info .tagline{color:#0a66c2;font-size:.85rem;font-weight:600;margin-top:2px}
    .profile-card .info p{color:#666;font-size:.9rem;margin-top:4px;white-space:pre-line}
    .profile-card .info a{color:#0a66c2}

    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
    .kpi-card{background:#fff;border-radius:14px;padding:22px 18px;box-shadow:0 2px 12px rgba(0,0,0,.06);border-top:4px solid var(--accent,#0a66c2);text-align:center}
    .kpi-card .label{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:#888;margin-bottom:6px}
    .kpi-card .value{font-size:2rem;font-weight:700;color:var(--accent,#0a66c2)}
    .kpi-card .sub{font-size:.75rem;color:#aaa;margin-top:4px}
    .kpi-card .change{font-size:.75rem;margin-top:6px;font-weight:600}
    .change.up{color:#27ae60}
    .change.down{color:#e74c3c}
    .change.flat{color:#999}

    .charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:24px;margin-bottom:32px}
    .chart-card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
    .chart-card h3{font-size:1rem;margin-bottom:16px;color:#333}
    .chart-card .na-msg{color:#bbb;font-size:.9rem;text-align:center;padding:40px 0}

    .top-post-section{margin-bottom:32px}
    .top-post-section h3{font-size:1.1rem;margin-bottom:16px;color:#333}
    .top-post-card{background:linear-gradient(135deg,#003049,#0a66c2,#0077b5);border-radius:14px;padding:24px;color:#fff;display:flex;gap:20px;align-items:center;flex-wrap:wrap;text-decoration:none}
    .top-post-card .top-img{width:160px;height:160px;border-radius:12px;object-fit:cover;flex-shrink:0;display:block}
    .top-post-card .top-img-placeholder{width:160px;height:160px;border-radius:12px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:3rem;flex-shrink:0}
    .top-post-card .top-info{flex:1;min-width:200px}
    .top-post-card .top-info h4{font-size:1rem;margin-bottom:8px;opacity:.8}
    .top-post-card .top-info .top-caption{font-size:.9rem;opacity:.9;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .top-post-card .top-stats{display:flex;gap:16px;flex-wrap:wrap}
    .top-post-card .top-stats span{font-size:.9rem;background:rgba(255,255,255,.15);padding:4px 12px;border-radius:20px}
    .reaction-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .reaction-pills .pill{font-size:.75rem;background:rgba(255,255,255,.12);padding:3px 10px;border-radius:14px}

    .posts-section h3{font-size:1.1rem;margin-bottom:16px;color:#333}
    .posts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
    .post-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);transition:transform .2s;text-decoration:none;color:inherit;display:flex;flex-direction:column}
    .post-card:hover{transform:translateY(-3px);box-shadow:0 4px 20px rgba(0,0,0,.1)}
    .post-card .post-img-wrap{width:100%;height:0;padding-bottom:75%;position:relative;overflow:hidden;background:#e8ecf0;flex-shrink:0}
    .post-card .post-img-wrap img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
    .post-card .post-img-wrap .no-img{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:#bbb;background:linear-gradient(135deg,#dce6f0,#c8d6e5)}
    .post-body{padding:14px;flex:1;display:flex;flex-direction:column}
    .caption{font-size:.82rem;color:#555;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px;min-height:3.5em}
    .post-meta{display:flex;gap:6px;flex-wrap:wrap}
    .post-meta span{font-size:.75rem;background:#f0f2f5;padding:3px 8px;border-radius:20px;color:#444}
    .post-meta span.highlight{background:#0a66c2;color:#fff}
    .post-date{font-size:.7rem;color:#aaa;margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center}
    .media-badge{font-size:.65rem;background:#e8f0fe;padding:2px 6px;border-radius:4px;color:#0a66c2;font-weight:600}

    .loading{text-align:center;padding:80px;color:#888;font-size:1.1rem}
    .err{background:#ffeaea;color:#c0392b;border-radius:10px;padding:16px;margin:20px 0}
    .toast{position:fixed;bottom:24px;right:24px;background:#333;color:#fff;padding:12px 24px;border-radius:10px;font-size:.9rem;z-index:999;display:none;box-shadow:0 4px 20px rgba(0,0,0,.3)}
    .toast.warn{background:#e67e22}
    .toast.ok{background:#27ae60}

    @media(max-width:600px){
      header{padding:14px 16px}
      main{padding:16px}
      .charts-grid{grid-template-columns:1fr}
      .profile-card{flex-direction:column;text-align:center}
      .top-post-card{flex-direction:column}
      .top-post-card .top-img,.top-post-card .top-img-placeholder{width:100%;height:200px}
    }
  </style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:12px">
    <a href="/" class="btn-back">&larr; Menu</a>
    <h1>💼 LinkedIn Dashboard</h1>
  </div>
  <div class="right">
    <span id="lastFetch">Loading...</span>
    <span id="sourceBadge" class="source-badge"></span>
    <form method="POST" action="/logout" style="margin:0">
      <button class="btn-logout" type="submit">Logout</button>
    </form>
  </div>
</header>
<main id="app"><div class="loading">⏳ Loading LinkedIn data...</div></main>
<div class="toast" id="toast"></div>
<script>
/* ── Reaction type map ── */
var RMAP={
  LIKE:{emoji:'\uD83D\uDC4D',label:'Like'},
  APPRECIATION:{emoji:'\uD83D\uDC4F',label:'Celebrate'},
  EMPATHY:{emoji:'\uD83D\uDE4F',label:'Support'},
  PRAISE:{emoji:'\u2764\uFE0F',label:'Love'},
  INTEREST:{emoji:'\uD83D\uDCA1',label:'Insightful'},
  ENTERTAINMENT:{emoji:'\uD83D\uDE04',label:'Funny'}
};
var PIE_COLORS=['#0a66c2','#e16745','#7fc15e','#f5c75d','#5f4b8b','#44bec7'];

function fmt(n){if(n==null||n===0)return'\u2014';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n)}
function pct(n){return n!=null?n.toFixed(2)+'%':'\u2014'}
function relDate(ts){if(!ts)return'';var d=Math.floor((Date.now()-new Date(ts).getTime())/86400000);if(d===0)return'Today';if(d===1)return'Yesterday';return d+' days ago'}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

function showToast(msg,type,ms){
  var t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+(type||'ok');t.style.display='block';
  setTimeout(function(){t.style.display='none'},ms||4000);
}

function timeData(ins,name){
  var m=(ins||[]).find(function(i){return i.name===name});
  if(!m||m._unavailable)return null;
  var v=m.values||[];
  if(v.length===0)return null;
  return{
    labels:v.map(function(x){return new Date(x.end_time).toLocaleDateString('de-DE',{day:'2-digit',month:'short'})}),
    data:v.map(function(x){return x.value||0})
  };
}

function makeChart(id,label,td,color,wholeNumbers){
  var el=document.getElementById(id);if(!el)return;
  if(!td){el.style.display='none';var p=document.createElement('div');p.className='na-msg';p.textContent='Not enough data yet \u2014 keep refreshing daily!';el.parentElement.appendChild(p);return;}
  new Chart(el,{type:'line',data:{labels:td.labels,datasets:[{label:label,data:td.data,borderColor:color,backgroundColor:color+'22',fill:true,tension:.35,pointRadius:2,borderWidth:2}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:10,font:{size:11}}},y:{beginAtZero:false,grid:{color:'#f5f5f5'},ticks:{font:{size:11},precision:wholeNumbers?0:undefined}}}}});
}

function makeBarChart(id,label,labels,data,color){
  var el=document.getElementById(id);if(!el)return;
  new Chart(el,{type:'bar',data:{labels:labels,datasets:[{label:label,data:data,backgroundColor:color+'88',borderColor:color,borderWidth:1,borderRadius:6}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{beginAtZero:true,grid:{color:'#f5f5f5'}}}}});
}

function makePieChart(id,labels,data,colors){
  var el=document.getElementById(id);if(!el)return;
  if(!data||data.length===0){el.style.display='none';var p=document.createElement('div');p.className='na-msg';p.textContent='No reaction data yet.';el.parentElement.appendChild(p);return;}
  new Chart(el,{type:'doughnut',data:{labels:labels,datasets:[{data:data,backgroundColor:colors,borderWidth:2,hoverOffset:6}]},options:{responsive:true,plugins:{legend:{position:'right',labels:{font:{size:12},padding:10}}}}});
}

function render(d){
  var a=d.account||{},insights=d.insights,posts=d.posts||[],cm=d.calculated_metrics||{},lastFetch=d.lastFetch,source=d.source;

  document.getElementById('lastFetch').textContent='Updated: '+new Date(lastFetch).toLocaleString('de-DE');
  document.getElementById('sourceBadge').textContent=source==='apify'?'\uD83D\uDD17 Apify':source==='mock'?'\uD83E\uDDEA Mock':'\uD83D\uDCE1 Live';

  var followers=a.followers_count||0;
  var engRate=cm.engagement_rate||0;
  var avgReactions=cm.avg_reactions||0;
  var avgComments=cm.avg_comments||0;
  var avgShares=cm.avg_shares||0;
  var postCount=cm.posts_scraped||0;
  var totalReactions=posts.reduce(function(s,p){return s+(p.insights?p.insights.reactions||0:0)},0);
  var totalShares=posts.reduce(function(s,p){return s+(p.insights?p.insights.shares||0:0)},0);

  /* follower change from history */
  var fcData=timeData(insights,'follower_count');
  var followerChange='';
  if(fcData&&fcData.data.length>=2){
    var diff=fcData.data[fcData.data.length-1]-fcData.data[0];
    var cls=diff>0?'up':diff<0?'down':'flat';
    var sign=diff>0?'+':'';
    followerChange='<div class="change '+cls+'">'+sign+diff+' since tracking started</div>';
  }

  /* best post */
  var sortedPosts=posts.slice().sort(function(x,y){return(y.insights?y.insights.engagement||0:0)-(x.insights?x.insights.engagement||0:0)});
  var bestPost=sortedPosts[0]||null;

  /* bar chart data */
  var chronoPosts=posts.slice().sort(function(x,y){return new Date(x.timestamp||0)-new Date(y.timestamp||0)});
  var postLabels=chronoPosts.map(function(p){
    return p.timestamp?new Date(p.timestamp).toLocaleDateString('de-DE',{day:'2-digit',month:'short'}):'?';
  });
  var postReactions=chronoPosts.map(function(p){return p.insights?p.insights.reactions||0:0});
  var postComments=chronoPosts.map(function(p){return p.insights?p.insights.comments||0:0});

  /* pie chart: aggregate reaction_breakdown */
  var rTotals={};
  posts.forEach(function(p){
    var bd=p.insights?p.insights.reaction_breakdown:null;
    if(!bd)return;
    Object.keys(bd).forEach(function(type){
      rTotals[type]=(rTotals[type]||0)+bd[type];
    });
  });
  var rTypes=Object.keys(rTotals).filter(function(t){return rTotals[t]>0});
  var pieLabels=rTypes.map(function(t){return(RMAP[t]?RMAP[t].emoji+' '+RMAP[t].label:t)});
  var pieData=rTypes.map(function(t){return rTotals[t]});

  /* posting frequency */
  var freqText='\u2014';
  if(posts.length>=2){
    var dates=posts.map(function(p){return new Date(p.timestamp)}).filter(function(d){return!isNaN(d)}).sort(function(a,b){return a-b});
    if(dates.length>=2){
      var weeks=(dates[dates.length-1]-dates[0])/(7*24*3600*1000);
      freqText=weeks>0?(dates.length/weeks).toFixed(1):''+dates.length;
    }
  }

  /* ── Best post HTML ── */
  var bestPostHTML='';
  if(bestPost){
    var bi=bestPost.insights||{};
    var bsrc=bestPost.local_image||'';
    bestPostHTML='<div class="top-post-section"><h3>\uD83C\uDFC6 Best Performing Post</h3>';
    bestPostHTML+='<a href="'+(bestPost.permalink||'#')+'" target="_blank" class="top-post-card">';
    if(bsrc){
      bestPostHTML+='<img class="top-img" src="'+esc(bsrc)+'" alt="" onerror="this.className=\'top-img-placeholder\';this.outerHTML=\'<div class=top-img-placeholder>\uD83D\uDCDD</div>\'">';
    }else{
      bestPostHTML+='<div class="top-img-placeholder">\uD83D\uDCDD</div>';
    }
    bestPostHTML+='<div class="top-info"><h4>Highest engagement from recent posts</h4>';
    bestPostHTML+='<div class="top-caption">'+esc(bestPost.text||'')+'</div>';
    bestPostHTML+='<div class="top-stats">';
    bestPostHTML+='<span>\uD83D\uDC4D '+fmt(bi.reactions)+' Reactions</span>';
    bestPostHTML+='<span>\uD83D\uDCAC '+fmt(bi.comments)+' Comments</span>';
    bestPostHTML+='<span>\uD83D\uDD01 '+fmt(bi.shares)+' Shares</span>';
    bestPostHTML+='<span>\uD83D\uDD25 '+fmt(bi.engagement)+' Total</span>';
    bestPostHTML+='</div>';
    /* reaction pills */
    if(bi.reaction_breakdown){
      bestPostHTML+='<div class="reaction-pills">';
      var entries=Object.keys(bi.reaction_breakdown).filter(function(t){return bi.reaction_breakdown[t]>0}).sort(function(a,b){return bi.reaction_breakdown[b]-bi.reaction_breakdown[a]});
      entries.forEach(function(t){
        var r=RMAP[t]||{emoji:'',label:t};
        bestPostHTML+='<span class="pill">'+r.emoji+' '+r.label+': '+fmt(bi.reaction_breakdown[t])+'</span>';
      });
      bestPostHTML+='</div>';
    }
    bestPostHTML+='</div></a></div>';
  }

  /* ── Post cards ── */
  var postsHTML='';
  posts.forEach(function(p){
    var ins=p.insights||{};
    var eng=ins.engagement||0;
    var isBest=bestPost&&p.id===bestPost.id;
    var src=p.local_image||'';

    postsHTML+='<a class="post-card" href="'+(p.permalink||'#')+'" target="_blank" rel="noopener">';
    postsHTML+='<div class="post-img-wrap">';
    if(src){
      postsHTML+='<img src="'+esc(src)+'" alt="" loading="lazy" onerror="this.parentElement.innerHTML=\'<div class=no-img>\uD83D\uDCDD</div>\'">';
    }else{
      postsHTML+='<div class="no-img">\uD83D\uDCDD</div>';
    }
    postsHTML+='</div>';
    postsHTML+='<div class="post-body">';
    postsHTML+='<div class="caption">'+esc(p.text||'(no text)')+'</div>';
    postsHTML+='<div class="post-meta">';
    postsHTML+='<span>\uD83D\uDC4D '+fmt(ins.reactions)+'</span>';
    postsHTML+='<span>\uD83D\uDCAC '+fmt(ins.comments)+'</span>';
    postsHTML+='<span>\uD83D\uDD01 '+fmt(ins.shares)+'</span>';
    postsHTML+='<span'+(isBest?' class="highlight"':'')+'>\uD83D\uDD25 '+fmt(eng)+'</span>';
    postsHTML+='</div>';
    postsHTML+='<div class="post-date"><span>'+relDate(p.timestamp)+'</span><span class="media-badge">'+(p.media_type||'')+'</span></div>';
    postsHTML+='</div></a>';
  });

  /* ── Assemble page ── */
  var html='';

  /* Profile card */
  var logoSrc=a.logo_url||'';
  html+='<div class="profile-card">';
  if(logoSrc){
    html+='<img src="'+esc(logoSrc)+'" alt="" onerror="this.outerHTML=\'<div style=font-size:3rem>\uD83C\uDFE2</div>\'">';
  }else{
    html+='<div style="font-size:3rem">\uD83C\uDFE2</div>';
  }
  html+='<div class="info"><h2>'+esc(a.name||'LinkedIn Company')+'</h2>';
  if(a.tagline)html+='<div class="tagline">'+esc(a.tagline)+'</div>';
  if(a.description)html+='<p>'+esc(a.description)+'</p>';
  if(a.website)html+='<p><a href="'+esc(a.website)+'" target="_blank">'+esc(a.website.replace(/^https?:\/\//,''))+'</a></p>';
  html+='</div></div>';

  /* KPI cards */
  html+='<div class="kpi-grid">';
  html+='<div class="kpi-card" style="--accent:#0a66c2"><div class="label">Followers</div><div class="value">'+fmt(followers)+'</div><div class="sub">Total</div>'+followerChange+'</div>';
  html+='<div class="kpi-card" style="--accent:#27ae60"><div class="label">Engagement Rate</div><div class="value">'+pct(engRate)+'</div><div class="sub">(reactions+comments+shares) / followers</div></div>';
  html+='<div class="kpi-card" style="--accent:#e16745"><div class="label">Avg Reactions</div><div class="value">'+fmt(Math.round(avgReactions))+'</div><div class="sub">Per post</div></div>';
  html+='<div class="kpi-card" style="--accent:#f39c12"><div class="label">Avg Comments</div><div class="value">'+fmt(Math.round(avgComments))+'</div><div class="sub">Per post</div></div>';
  html+='<div class="kpi-card" style="--accent:#44bec7"><div class="label">Avg Shares</div><div class="value">'+fmt(Math.round(avgShares))+'</div><div class="sub">Per post</div></div>';
  html+='<div class="kpi-card" style="--accent:#003049"><div class="label">Total Reactions</div><div class="value">'+fmt(totalReactions)+'</div><div class="sub">Last '+postCount+' posts</div></div>';
  html+='<div class="kpi-card" style="--accent:#2980b9"><div class="label">Posts Scraped</div><div class="value">'+fmt(postCount)+'</div><div class="sub">'+freqText+' posts/week</div></div>';
  html+='</div>';

  /* Best post */
  html+=bestPostHTML;

  /* Charts */
  html+='<div class="charts-grid">';
  html+='<div class="chart-card"><h3>\uD83D\uDC65 Follower Count Over Time</h3><canvas id="cFC"></canvas></div>';
  html+='<div class="chart-card"><h3>\uD83D\uDCCA Engagement Rate Over Time</h3><canvas id="cER"></canvas></div>';
  html+='<div class="chart-card"><h3>\uD83D\uDC4D Reactions per Post</h3><canvas id="cReactions"></canvas></div>';
  html+='<div class="chart-card"><h3>\uD83D\uDCAC Comments per Post</h3><canvas id="cComments"></canvas></div>';
  html+='<div class="chart-card"><h3>\uD83C\uDF1F Reaction Type Distribution</h3><canvas id="cPie"></canvas></div>';
  html+='</div>';

  /* Recent posts */
  html+='<div class="posts-section"><h3>\uD83D\uDDD3 Recent Posts</h3><div class="posts-grid">'+postsHTML+'</div></div>';

  document.getElementById('app').innerHTML=html;

  /* Render charts */
  makeChart('cFC','Followers',fcData,'#0a66c2', true);
  makeChart('cER','Engagement Rate',timeData(insights,'engagement_rate'),'#27ae60', false);
  makeBarChart('cReactions','Reactions',postLabels,postReactions,'#0a66c2');
  makeBarChart('cComments','Comments',postLabels,postComments,'#f39c12');
  makePieChart('cPie',pieLabels,pieData,PIE_COLORS.slice(0,pieLabels.length));
}

async function loadData(){
  try{var r=await fetch('/api/linkedin/kpis');if(!r.ok)throw new Error('HTTP '+r.status);render(await r.json())}
  catch(e){document.getElementById('app').innerHTML='<div class="err">\u274C '+e.message+'</div>'}
}


loadData();
</script>
</body>
</html>
