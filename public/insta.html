<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Finance Club Leipzig – Instagram Analytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root{--bg:#080b12;--surface:#111827;--surface-2:#1e293b;--border:rgba(148,163,184,.08);--border-2:rgba(148,163,184,.12);--text:#f1f5f9;--text-2:#94a3b8;--text-3:#64748b;--emerald:#10b981;--emerald-dim:rgba(16,185,129,.12);--ig1:#E1306C;--ig2:#F77737}

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:'Nunito Sans',system-ui,sans-serif;
      background:var(--bg);
      color:var(--text);
      background-image:
        linear-gradient(var(--border) 1px,transparent 1px),
        linear-gradient(90deg,var(--border) 1px,transparent 1px),
        radial-gradient(ellipse 60% 40% at 50% 0%,rgba(225,48,108,.07),transparent);
      background-size:64px 64px,64px 64px,100% 100%;
      min-height:100vh;
    }

    header{
      background:var(--surface);
      border-bottom:1px solid var(--border-2);
      color:var(--text);
      padding:16px 32px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:12px;
      position:sticky;
      top:0;
      z-index:100;
      backdrop-filter:blur(12px);
    }
    header h1{
      font-family:'Syne',sans-serif;
      font-weight:700;
      font-size:1.2rem;
      display:flex;
      align-items:center;
      gap:10px;
    }
    header h1 .ig-icon{color:#E1306C}
    .back-link{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:7px 14px;
      background:transparent;
      color:var(--text-2);
      border:1px solid var(--border-2);
      border-radius:8px;
      font-size:.8rem;
      font-family:'Nunito Sans',sans-serif;
      text-decoration:none;
      transition:all .2s;
    }
    .back-link:hover{background:var(--surface-2);color:var(--text)}

    .right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    #lastFetch{font-size:.75rem;color:var(--text-3);font-family:'JetBrains Mono',monospace;font-weight:400}
    .btn-logout{
      padding:7px 14px;
      background:transparent;
      color:var(--text-3);
      border:1px solid var(--border-2);
      border-radius:8px;
      cursor:pointer;
      font-size:.78rem;
      font-family:'Nunito Sans',sans-serif;
      transition:all .2s;
    }
    .btn-logout:hover{background:var(--surface-2);color:var(--text)}
    .source-badge{
      font-size:.7rem;
      font-family:'JetBrains Mono',monospace;
      background:var(--surface-2);
      border:1px solid var(--border-2);
      padding:4px 12px;
      border-radius:20px;
      color:var(--text-2);
    }

    main{padding:32px;max-width:1320px;margin:0 auto}

    /* Profile card */
    .profile-card{
      background:var(--surface);
      border:1px solid var(--border-2);
      border-radius:16px;
      padding:28px 32px;
      display:flex;
      align-items:center;
      gap:24px;
      margin-bottom:28px;
      box-shadow:0 2px 12px rgba(0,0,0,.2);
      animation:fadeUp .5s ease both;
    }
    .profile-card img{
      width:76px;height:76px;border-radius:50%;object-fit:cover;
      border:3px solid #E1306C;
      flex-shrink:0;
    }
    .profile-card .avatar-placeholder{
      width:76px;height:76px;border-radius:50%;
      background:var(--surface-2);
      border:3px solid #E1306C;
      display:flex;align-items:center;justify-content:center;
      color:var(--text-3);
      flex-shrink:0;
    }
    .profile-card .info h2{font-family:'Syne',sans-serif;font-weight:700;font-size:1.2rem;color:var(--text)}
    .profile-card .info p{color:var(--text-2);font-size:.88rem;margin-top:4px;white-space:pre-line;line-height:1.5}
    .profile-card .info a{color:#E1306C;text-decoration:none}
    .profile-card .info a:hover{text-decoration:underline}

    /* KPI Grid */
    .kpi-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(185px,1fr));
      gap:16px;
      margin-bottom:28px;
    }
    .kpi-card{
      background:var(--surface);
      border:1px solid var(--border-2);
      border-radius:16px;
      padding:22px 18px;
      box-shadow:0 2px 12px rgba(0,0,0,.2);
      text-align:center;
      position:relative;
      overflow:hidden;
      animation:fadeUp .5s ease both;
    }
    .kpi-card::before{
      content:'';
      position:absolute;
      top:0;left:0;right:0;
      height:3px;
      background:linear-gradient(90deg,var(--accent,#E1306C),var(--accent-end,#F77737));
    }
    .kpi-card .icon{margin-bottom:8px;color:var(--accent,#E1306C);opacity:.7}
    .kpi-card .label{
      font-size:.65rem;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--text-3);
      margin-bottom:8px;
      font-weight:600;
    }
    .kpi-card .value{
      font-size:1.9rem;
      font-weight:500;
      font-family:'JetBrains Mono',monospace;
      color:var(--accent,#E1306C);
    }
    .kpi-card .sub{font-size:.7rem;color:var(--text-3);margin-top:6px}
    .kpi-card .change{font-size:.72rem;margin-top:8px;font-weight:600;font-family:'JetBrains Mono',monospace}
    .change.up{color:#10b981}
    .change.down{color:#ef4444}
    .change.flat{color:var(--text-3)}

    /* Charts */
    .charts-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
      gap:20px;
      margin-bottom:32px;
    }
    .chart-card{
      background:var(--surface);
      border:1px solid var(--border-2);
      border-radius:16px;
      padding:24px;
      box-shadow:0 2px 12px rgba(0,0,0,.2);
      animation:fadeUp .5s ease both;
    }
    .chart-card h3{
      font-family:'Syne',sans-serif;
      font-weight:700;
      font-size:.95rem;
      margin-bottom:16px;
      color:var(--text);
      display:flex;
      align-items:center;
      gap:8px;
    }
    .chart-card h3 .chart-icon{color:var(--text-3)}
    .chart-card .na-msg{
      color:var(--text-3);
      font-size:.85rem;
      text-align:center;
      padding:40px 0;
    }

    /* Best Post */
    .top-post-section{margin-bottom:32px;animation:fadeUp .5s ease both}
    .top-post-section h3{
      font-family:'Syne',sans-serif;
      font-weight:700;
      font-size:1.05rem;
      margin-bottom:16px;
      color:var(--text);
      display:flex;
      align-items:center;
      gap:10px;
    }
    .top-post-card{
      background:linear-gradient(135deg,#E1306C,#F77737);
      border-radius:16px;
      padding:28px;
      color:#fff;
      display:flex;
      gap:24px;
      align-items:center;
      flex-wrap:wrap;
      text-decoration:none;
      box-shadow:0 4px 24px rgba(225,48,108,.25);
      transition:transform .2s,box-shadow .2s;
    }
    .top-post-card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(225,48,108,.35)}
    .top-post-card .top-img{
      width:160px;height:160px;border-radius:12px;
      object-fit:cover;flex-shrink:0;display:block;
      box-shadow:0 4px 16px rgba(0,0,0,.3);
    }
    .top-post-card .top-img-placeholder{
      width:160px;height:160px;border-radius:12px;
      background:rgba(255,255,255,.12);
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;
      color:rgba(255,255,255,.5);
    }
    .top-post-card .top-info{flex:1;min-width:200px}
    .top-post-card .top-info h4{
      font-family:'Syne',sans-serif;
      font-weight:600;
      font-size:.9rem;
      margin-bottom:8px;
      opacity:.85;
    }
    .top-post-card .top-info .top-caption{
      font-size:.88rem;
      opacity:.9;
      margin-bottom:14px;
      display:-webkit-box;
      -webkit-line-clamp:3;
      -webkit-box-orient:vertical;
      overflow:hidden;
      line-height:1.5;
    }
    .top-post-card .top-stats{display:flex;gap:10px;flex-wrap:wrap}
    .top-post-card .top-stats span{
      font-size:.8rem;
      background:rgba(255,255,255,.18);
      padding:5px 14px;
      border-radius:20px;
      display:inline-flex;
      align-items:center;
      gap:5px;
      font-family:'JetBrains Mono',monospace;
      font-weight:400;
      backdrop-filter:blur(4px);
    }

    /* Posts Grid */
    .posts-section{animation:fadeUp .5s ease both}
    .posts-section h3{
      font-family:'Syne',sans-serif;
      font-weight:700;
      font-size:1.05rem;
      margin-bottom:16px;
      color:var(--text);
      display:flex;
      align-items:center;
      gap:10px;
    }
    .posts-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:16px;
    }
    .post-card{
      background:var(--surface);
      border:1px solid var(--border-2);
      border-radius:14px;
      overflow:hidden;
      box-shadow:0 2px 12px rgba(0,0,0,.2);
      transition:transform .25s,box-shadow .25s;
      text-decoration:none;
      color:inherit;
      display:flex;
      flex-direction:column;
    }
    .post-card:hover{transform:translateY(-4px);box-shadow:0 8px 28px rgba(0,0,0,.35)}
    .post-card .post-img-wrap{
      width:100%;height:0;padding-bottom:100%;
      position:relative;overflow:hidden;
      background:var(--surface-2);
      flex-shrink:0;
    }
    .post-card .post-img-wrap img{
      position:absolute;top:0;left:0;
      width:100%;height:100%;
      object-fit:cover;display:block;
    }
    .post-card .post-img-wrap .no-img{
      position:absolute;top:0;left:0;
      width:100%;height:100%;
      display:flex;align-items:center;justify-content:center;
      color:var(--text-3);
      background:linear-gradient(135deg,var(--surface-2),var(--surface));
    }
    .post-body{padding:16px;flex:1;display:flex;flex-direction:column}
    .caption{
      font-size:.82rem;
      color:var(--text-2);
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
      margin-bottom:12px;
      min-height:2.4em;
      line-height:1.5;
    }
    .post-meta{display:flex;gap:6px;flex-wrap:wrap}
    .post-meta span{
      font-size:.72rem;
      background:var(--surface-2);
      border:1px solid var(--border-2);
      padding:4px 10px;
      border-radius:20px;
      color:var(--text-2);
      display:inline-flex;
      align-items:center;
      gap:4px;
      font-family:'JetBrains Mono',monospace;
    }
    .post-meta span.highlight{
      background:linear-gradient(135deg,rgba(225,48,108,.2),rgba(247,119,55,.2));
      border-color:rgba(225,48,108,.3);
      color:#F77737;
    }
    .post-date{
      font-size:.68rem;
      color:var(--text-3);
      margin-top:auto;
      padding-top:10px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .post-date .date-text{display:inline-flex;align-items:center;gap:4px}
    .media-badge{
      font-size:.62rem;
      background:var(--surface-2);
      border:1px solid var(--border-2);
      padding:2px 8px;
      border-radius:4px;
      color:var(--text-3);
      font-family:'JetBrains Mono',monospace;
    }

    /* Loading, error, toast */
    .loading{
      text-align:center;
      padding:80px;
      color:var(--text-3);
      font-size:1rem;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:16px;
    }
    .loading .spinner{
      width:32px;height:32px;
      border:3px solid var(--surface-2);
      border-top-color:#E1306C;
      border-radius:50%;
      animation:spin .8s linear infinite;
    }
    .err{
      background:rgba(239,68,68,.1);
      border:1px solid rgba(239,68,68,.2);
      color:#ef4444;
      border-radius:12px;
      padding:20px;
      margin:20px 0;
      font-size:.9rem;
    }
    .toast{
      position:fixed;
      bottom:24px;right:24px;
      background:var(--surface);
      border:1px solid var(--border-2);
      color:var(--text);
      padding:14px 24px;
      border-radius:12px;
      font-size:.85rem;
      z-index:999;
      display:none;
      box-shadow:0 8px 32px rgba(0,0,0,.4);
      font-family:'Nunito Sans',sans-serif;
    }
    .toast.warn{border-color:rgba(245,158,11,.3);color:#f59e0b}
    .toast.ok{border-color:rgba(16,185,129,.3);color:#10b981}

    /* Animations */
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(16px)}
      to{opacity:1;transform:translateY(0)}
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Staggered delays for cards */
    .kpi-card:nth-child(1){animation-delay:.05s}
    .kpi-card:nth-child(2){animation-delay:.1s}
    .kpi-card:nth-child(3){animation-delay:.15s}
    .kpi-card:nth-child(4){animation-delay:.2s}
    .kpi-card:nth-child(5){animation-delay:.25s}
    .kpi-card:nth-child(6){animation-delay:.3s}
    .kpi-card:nth-child(7){animation-delay:.35s}
    .kpi-card:nth-child(8){animation-delay:.4s}
    .chart-card:nth-child(1){animation-delay:.15s}
    .chart-card:nth-child(2){animation-delay:.25s}
    .chart-card:nth-child(3){animation-delay:.35s}
    .chart-card:nth-child(4){animation-delay:.45s}
    .top-post-section{animation-delay:.1s}
    .posts-section{animation-delay:.2s}

    @media(max-width:600px){
      header{padding:14px 16px}
      main{padding:16px}
      .charts-grid{grid-template-columns:1fr}
      .profile-card{flex-direction:column;text-align:center}
      .top-post-card{flex-direction:column}
      .top-post-card .top-img,.top-post-card .top-img-placeholder{width:100%;height:200px}
    }
  </style>
</head>
<body>
<header>
  <a href="/" class="back-link"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg> Menu</a>
  <h1><span class="ig-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/></svg></span> Instagram Analytics</h1>
  <div class="right">
    <span id="lastFetch">Loading...</span>
    <span id="sourceBadge" class="source-badge"></span>
    <form method="POST" action="/logout" style="margin:0">
      <button class="btn-logout" type="submit">Logout</button>
    </form>
  </div>
</header>
<main id="app"><div class="loading"><div class="spinner"></div>Loading Instagram data...</div></main>
<div class="toast" id="toast"></div>
<script>
function fmt(n){if(n==null||n===0)return'\u2014';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n)}
function pct(n){return n!=null?n.toFixed(2)+'%':'\u2014'}
function relDate(ts){if(!ts)return'';var d=Math.floor((Date.now()-new Date(ts).getTime())/86400000);if(d===0)return'Today';if(d===1)return'Yesterday';return d+' days ago'}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

function showToast(msg,type,ms){
  var t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+(type||'ok');t.style.display='block';
  setTimeout(function(){t.style.display='none'},ms||4000);
}

function postImg(p){
  return p.local_image||p.thumbnail_url||p.media_url||'';
}

function timeData(ins,name){
  var m=(ins||[]).find(function(i){return i.name===name});
  if(!m||m._unavailable)return null;
  var v=m.values||[];
  if(v.length===0)return null;
  return{
    labels:v.map(function(x){return new Date(x.end_time).toLocaleDateString('de-DE',{day:'2-digit',month:'short'})}),
    data:v.map(function(x){return x.value||0})
  };
}

function makeChart(id,label,td,color,wholeNumbers){
  var el=document.getElementById(id);if(!el)return;
  if(!td){el.style.display='none';var p=document.createElement('div');p.className='na-msg';p.textContent='Not enough data yet \u2014 keep refreshing daily!';el.parentElement.appendChild(p);return;}
  new Chart(el,{type:'line',data:{labels:td.labels,datasets:[{label:label,data:td.data,borderColor:color,backgroundColor:color+'22',fill:true,tension:.35,pointRadius:2,borderWidth:2}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(148,163,184,.06)'},ticks:{maxTicksLimit:10,font:{size:11,family:'JetBrains Mono'},color:'#64748b'}},y:{beginAtZero:false,grid:{color:'rgba(148,163,184,.06)'},ticks:{font:{size:11,family:'JetBrains Mono'},color:'#64748b',precision:wholeNumbers?0:undefined}}}}});
}

function makeBarChart(id,label,labels,data,color){
  var el=document.getElementById(id);if(!el)return;
  new Chart(el,{type:'bar',data:{labels:labels,datasets:[{label:label,data:data,backgroundColor:color+'44',borderColor:color,borderWidth:1,borderRadius:6}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(148,163,184,.06)'},ticks:{font:{size:10,family:'JetBrains Mono'},color:'#64748b'}},y:{beginAtZero:true,grid:{color:'rgba(148,163,184,.06)'},ticks:{font:{size:11,family:'JetBrains Mono'},color:'#64748b'}}}}});
}

var SVG_HEART='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
var SVG_COMMENT='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
var SVG_PLAY='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
var SVG_FIRE='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12c2-2.96 0-7-1-8 0 3.038-1.773 4.741-3 6-1.226 1.26-2 3.24-2 5a6 6 0 1 0 12 0c0-1.532-1.056-3.94-2-5-1.786 3-2.791 3-4 2z"/></svg>';
var SVG_TROPHY='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>';
var SVG_CALENDAR='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
var SVG_IMG_PLACEHOLDER='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
var SVG_IMG_PLACEHOLDER_LG='<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
var SVG_PEOPLE='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>';
var SVG_CHART='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>';
var SVG_CLOCK='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
var SVG_CAMERA='<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/></svg>';

function onImgErr(el,type){
  if(type==='avatar'){el.outerHTML='<div class="avatar-placeholder">'+SVG_CAMERA+'</div>';}
  else if(type==='top'){el.outerHTML='<div class="top-img-placeholder">'+SVG_IMG_PLACEHOLDER_LG+'</div>';}
  else{el.parentElement.innerHTML='<div class="no-img">'+SVG_IMG_PLACEHOLDER+'</div>';}
}

function render(d){
  var a=d.account,insights=d.insights,posts=d.posts,cm=d.calculated_metrics,lastFetch=d.lastFetch,source=d.source;

  document.getElementById('lastFetch').textContent='Updated: '+new Date(lastFetch).toLocaleString('de-DE');
  var badgeEl=document.getElementById('sourceBadge');
  if(source==='apify')badgeEl.textContent='\u2197 Apify';
  else if(source==='mock')badgeEl.textContent='\u2022 Mock';
  else badgeEl.textContent='\u2022 Live';

  var followers=a?a.followers_count||0:0;
  var following=a?a.following_count||0:0;
  var mediaCount=a?a.media_count||0:0;
  var engRate=cm?cm.engagement_rate||0:0;
  var avgLikes=cm?cm.avg_likes||0:0;
  var avgComments=cm?cm.avg_comments||0:0;

  var fcData=timeData(insights,'follower_count');
  var followerChange='';
  if(fcData&&fcData.data.length>=2){
    var diff=fcData.data[fcData.data.length-1]-fcData.data[0];
    var cls=diff>0?'up':diff<0?'down':'flat';
    var sign=diff>0?'+':'';
    followerChange='<div class="change '+cls+'">'+sign+diff+' since tracking started</div>';
  }

  var sortedPosts=(posts||[]).slice().sort(function(x,y){return(y.insights?y.insights.engagement||0:0)-(x.insights?x.insights.engagement||0:0)});
  var bestPost=sortedPosts[0]||null;

  var chronoPosts=(posts||[]).slice().sort(function(x,y){return new Date(x.timestamp||0)-new Date(y.timestamp||0)});
  var postLabels=chronoPosts.map(function(p){
    return p.timestamp?new Date(p.timestamp).toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'}):'?';
  });
  var postLikes=chronoPosts.map(function(p){return p.insights?p.insights.likes||0:0});
  var postComments=chronoPosts.map(function(p){return p.insights?p.insights.comments||0:0});

  var totalLikes=(posts||[]).reduce(function(s,p){return s+(p.insights?p.insights.likes||0:0)},0);
  var totalVideoViews=(posts||[]).reduce(function(s,p){return s+(p.insights?p.insights.video_views||0:0)},0);

  var postsHTML='';
  (posts||[]).slice().sort(function(x,y){return new Date(y.timestamp||0)-new Date(x.timestamp||0)}).forEach(function(p){
    var ins=p.insights||{};
    var eng=(ins.likes||0)+(ins.comments||0);
    var isBest=bestPost&&p.id===bestPost.id;
    var src=postImg(p);

    postsHTML+='<a class="post-card" href="'+(p.permalink||'#')+'" target="_blank" rel="noopener">';
    postsHTML+='<div class="post-img-wrap">';
    if(src){
      postsHTML+='<img src="'+esc(src)+'" alt="" loading="lazy" onerror="onImgErr(this,\'post\')">';
    }else{
      postsHTML+='<div class="no-img">'+SVG_IMG_PLACEHOLDER+'</div>';
    }
    postsHTML+='</div>';
    postsHTML+='<div class="post-body">';
    postsHTML+='<div class="caption">'+esc(p.caption||'(no caption)')+'</div>';
    postsHTML+='<div class="post-meta">';
    postsHTML+='<span>'+SVG_HEART+' '+fmt(ins.likes)+'</span>';
    postsHTML+='<span>'+SVG_COMMENT+' '+fmt(ins.comments)+'</span>';
    if(ins.video_views)postsHTML+='<span>'+SVG_PLAY+' '+fmt(ins.video_views)+'</span>';
    postsHTML+='<span'+(isBest?' class="highlight"':'')+'>'+SVG_FIRE+' '+fmt(eng)+'</span>';
    postsHTML+='</div>';
    postsHTML+='<div class="post-date"><span class="date-text">'+SVG_CLOCK+' '+relDate(p.timestamp)+(p.timestamp?', '+new Date(p.timestamp).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}):'')+'</span><span class="media-badge">'+(p.media_type||'')+'</span></div>';
    postsHTML+='</div></a>';
  });

  var bestPostHTML='';
  if(bestPost){
    var bi=bestPost.insights||{};
    var bsrc=postImg(bestPost);
    bestPostHTML='<div class="top-post-section"><h3>'+SVG_TROPHY+' Best Performing Post</h3>';
    bestPostHTML+='<a href="'+(bestPost.permalink||'#')+'" target="_blank" class="top-post-card">';
    if(bsrc){
      bestPostHTML+='<img class="top-img" src="'+esc(bsrc)+'" alt="" onerror="onImgErr(this,\'top\')">';
    }else{
      bestPostHTML+='<div class="top-img-placeholder">'+SVG_IMG_PLACEHOLDER_LG+'</div>';
    }
    bestPostHTML+='<div class="top-info"><h4>Highest engagement from recent posts</h4>';
    bestPostHTML+='<div class="top-caption">'+esc(bestPost.caption||'')+'</div>';
    bestPostHTML+='<div class="top-stats">';
    bestPostHTML+='<span>'+SVG_HEART+' '+fmt(bi.likes)+' Likes</span>';
    bestPostHTML+='<span>'+SVG_COMMENT+' '+fmt(bi.comments)+' Comments</span>';
    if(bi.video_views)bestPostHTML+='<span>'+SVG_PLAY+' '+fmt(bi.video_views)+' Views</span>';
    bestPostHTML+='<span>'+SVG_FIRE+' '+fmt((bi.likes||0)+(bi.comments||0))+' Total</span>';
    bestPostHTML+='</div></div></a></div>';
  }

  var profSrc=a?a.profile_picture_url||'':'';

  var html='';
  html+='<div class="profile-card">';
  if(profSrc){
    html+='<img src="'+esc(profSrc)+'" alt="" onerror="onImgErr(this,\'avatar\')">';
  }else{
    html+='<div class="avatar-placeholder">'+SVG_CAMERA+'</div>';
  }
  html+='<div class="info"><h2>@'+esc(a?a.username||'':'\u2014')+'</h2>';
  html+='<p>'+esc(a?a.biography||'':'')+'</p>';
  if(a&&a.website)html+='<p><a href="'+esc(a.website)+'" target="_blank">'+esc(a.website)+'</a></p>';
  html+='</div></div>';

  html+='<div class="kpi-grid">';
  html+='<div class="kpi-card" style="--accent:#E1306C;--accent-end:#F77737"><div class="icon">'+SVG_PEOPLE+'</div><div class="label">Followers</div><div class="value">'+fmt(followers)+'</div><div class="sub">Total</div>'+followerChange+'</div>';
  html+='<div class="kpi-card" style="--accent:#8b5cf6;--accent-end:#a78bfa"><div class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg></div><div class="label">Following</div><div class="value">'+fmt(following)+'</div><div class="sub">Accounts</div></div>';
  html+='<div class="kpi-card" style="--accent:#10b981;--accent-end:#34d399"><div class="icon">'+SVG_CHART+'</div><div class="label">Engagement Rate</div><div class="value">'+pct(engRate)+'</div><div class="sub">Avg per post / followers</div></div>';
  html+='<div class="kpi-card" style="--accent:#ef4444;--accent-end:#f87171"><div class="icon">'+SVG_HEART+'</div><div class="label">Avg Likes</div><div class="value">'+fmt(Math.round(avgLikes))+'</div><div class="sub">Per post</div></div>';
  html+='<div class="kpi-card" style="--accent:#f59e0b;--accent-end:#fbbf24"><div class="icon">'+SVG_COMMENT+'</div><div class="label">Avg Comments</div><div class="value">'+fmt(Math.round(avgComments))+'</div><div class="sub">Per post</div></div>';
  html+='<div class="kpi-card" style="--accent:#6366f1;--accent-end:#818cf8"><div class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></div><div class="label">Total Posts</div><div class="value">'+fmt(mediaCount)+'</div><div class="sub">Published</div></div>';
  html+='<div class="kpi-card" style="--accent:#ec4899;--accent-end:#f472b6"><div class="icon">'+SVG_HEART+'</div><div class="label">Total Likes</div><div class="value">'+fmt(totalLikes)+'</div><div class="sub">Last '+(posts?posts.length:0)+' posts</div></div>';
  html+='<div class="kpi-card" style="--accent:#06b6d4;--accent-end:#22d3ee"><div class="icon">'+SVG_PLAY+'</div><div class="label">Video Views</div><div class="value">'+fmt(totalVideoViews)+'</div><div class="sub">Last '+(posts?posts.length:0)+' posts</div></div>';
  html+='</div>';

  html+=bestPostHTML;

  html+='<div class="charts-grid">';
  html+='<div class="chart-card"><h3><span class="chart-icon">'+SVG_PEOPLE+'</span> Follower Count Over Time</h3><canvas id="cFC"></canvas></div>';
  html+='<div class="chart-card"><h3><span class="chart-icon">'+SVG_CHART+'</span> Engagement Rate Over Time</h3><canvas id="cER"></canvas></div>';
  html+='<div class="chart-card"><h3><span class="chart-icon">'+SVG_HEART+'</span> Likes per Post</h3><canvas id="cLikes"></canvas></div>';
  html+='<div class="chart-card"><h3><span class="chart-icon">'+SVG_COMMENT+'</span> Comments per Post</h3><canvas id="cComments"></canvas></div>';
  html+='</div>';

  html+='<div class="posts-section"><h3>'+SVG_CALENDAR+' Recent Posts</h3><div class="posts-grid">'+postsHTML+'</div></div>';

  document.getElementById('app').innerHTML=html;

  makeChart('cFC','Followers',fcData,'#E1306C',true);
  makeChart('cER','Engagement Rate',timeData(insights,'engagement_rate'),'#10b981',false);
  makeBarChart('cLikes','Likes',postLabels,postLikes,'#ef4444');
  makeBarChart('cComments','Comments',postLabels,postComments,'#f59e0b');
}

async function loadData(){
  try{var r=await fetch('/api/kpis');if(!r.ok)throw new Error('HTTP '+r.status);render(await r.json())}
  catch(e){document.getElementById('app').innerHTML='<div class="err">'+e.message+'</div>'}
}


loadData();
</script>
</body>
</html>
