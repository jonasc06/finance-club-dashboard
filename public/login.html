<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Finance Club Leipzig – Login</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);min-height:100vh;display:flex;align-items:center;justify-content:center}
    .card{background:#fff;border-radius:16px;padding:48px 40px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
    .logo{font-size:2.4rem;margin-bottom:8px}
    h1{font-size:1.4rem;color:#1a1a2e;margin-bottom:4px}
    p{color:#666;font-size:.9rem;margin-bottom:32px}
    input{width:100%;padding:14px 16px;border:2px solid #e0e0e0;border-radius:10px;font-size:1rem;margin-bottom:16px;outline:none;transition:border-color .2s}
    input:focus{border-color:#2c5364}
    button{width:100%;padding:14px;background:linear-gradient(90deg,#203a43,#2c5364);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer}
    button:hover{opacity:.9}
    .error{background:#ffeaea;color:#c0392b;border-radius:8px;padding:10px;margin-bottom:16px;font-size:.9rem}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📊</div>
    <h1>Finance Club Leipzig</h1>
    <p>KPI Dashboard &mdash; Management Access</p>
    <form method="POST" action="/login">
      <div id="err" class="error" style="display:none">Wrong password. Try again.</div>
      <input type="password" name="password" placeholder="Enter dashboard password" autofocus required/>
      <button type="submit">Sign In &rarr;</button>
    </form>
  </div>
  <script>if(location.search.includes('error=1'))document.getElementById('err').style.display='block';</script>
</body>
</html>
