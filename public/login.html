<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Finance Club Leipzig – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#080b12;--surface:#111827;--surface-2:#1e293b;--border:rgba(148,163,184,.08);--text:#f1f5f9;--text-2:#94a3b8;--text-3:#64748b;--emerald:#10b981;--emerald-dim:rgba(16,185,129,.12)}
    body{font-family:'Nunito Sans',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text);overflow:hidden}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% -20%,rgba(16,185,129,.06),transparent 70%),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(56,189,248,.04),transparent 60%);pointer-events:none}
    .grid-bg{position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:64px 64px;pointer-events:none;opacity:.6}
    .card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:56px 44px 48px;width:420px;max-width:calc(100vw - 40px);text-align:center;animation:cardIn .6s ease both}
    .card::before{content:'';position:absolute;top:-1px;left:40px;right:40px;height:2px;background:linear-gradient(90deg,transparent,var(--emerald),transparent);border-radius:2px}
    @keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
    .lock-icon{width:56px;height:56px;border-radius:16px;background:var(--emerald-dim);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;color:var(--emerald)}
    h1{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
    .sub{color:var(--text-3);font-size:.88rem;margin-bottom:36px;font-weight:400}
    input{width:100%;padding:14px 18px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;font-size:.95rem;font-family:'Nunito Sans',sans-serif;color:var(--text);outline:none;transition:border-color .25s,box-shadow .25s}
    input::placeholder{color:var(--text-3)}
    input:focus{border-color:rgba(16,185,129,.4);box-shadow:0 0 0 3px rgba(16,185,129,.1)}
    .btn{width:100%;padding:14px;background:var(--emerald);color:#080b12;border:none;border-radius:12px;font-size:.95rem;font-family:'Syne',sans-serif;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;margin-top:16px;letter-spacing:.01em}
    .btn:hover{background:#0ea472;transform:translateY(-1px);box-shadow:0 8px 24px rgba(16,185,129,.25)}
    .btn:active{transform:translateY(0)}
    .error{background:rgba(251,113,133,.08);color:#fb7185;border:1px solid rgba(251,113,133,.15);border-radius:10px;padding:12px;margin-bottom:16px;font-size:.85rem;font-weight:500;animation:shake .4s ease}
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
    .footer{margin-top:28px;font-size:.75rem;color:var(--text-3)}
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="card">
    <div class="lock-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1>Finance Club Leipzig</h1>
    <div class="sub">KPI Dashboard &mdash; Management Access</div>
    <form method="POST" action="/login">
      <div id="err" class="error" style="display:none">Wrong password. Please try again.</div>
      <input type="password" name="password" placeholder="Enter dashboard password" autofocus required/>
      <button class="btn" type="submit">Sign In <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
    </form>
    <div class="footer">Secured access &middot; Session expires after 8 hours</div>
  </div>
  <script>if(location.search.includes('error=1'))document.getElementById('err').style.display='block';</script>
</body>
</html>
