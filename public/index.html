<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Finance Club Leipzig – KPI Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f2f5;color:#1a1a2e}
    header{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:#fff;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
    header h1{font-size:1.3rem}
    .right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    #lastFetch{font-size:.8rem;opacity:.7}
    .btn-refresh{padding:8px 18px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;cursor:pointer;font-size:.85rem;transition:all .2s}
    .btn-refresh:hover{background:rgba(255,255,255,.25)}
    .btn-refresh:disabled{opacity:.4;cursor:not-allowed}
    .btn-logout{padding:8px 16px;background:transparent;color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.2);border-radius:8px;cursor:pointer;font-size:.8rem}
    .source-badge{font-size:.7rem;background:rgba(255,255,255,.15);padding:3px 10px;border-radius:20px}
    main{padding:32px;max-width:1280px;margin:0 auto}

    /* Profile */
    .profile-card{background:#fff;border-radius:14px;padding:24px 28px;display:flex;align-items:center;gap:20px;margin-bottom:28px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
    .profile-card img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #2c5364}
    .profile-card .info h2{font-size:1.2rem}
    .profile-card .info p{color:#666;font-size:.9rem;margin-top:4px;white-space:pre-line}
    .profile-card .info a{color:#2c5364}

    /* KPI Cards */
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
    .kpi-card{background:#fff;border-radius:14px;padding:22px 18px;box-shadow:0 2px 12px rgba(0,0,0,.06);border-top:4px solid var(--accent,#2c5364);text-align:center;position:relative}
    .kpi-card .label{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:#888;margin-bottom:6px}
    .kpi-card .value{font-size:2rem;font-weight:700;color:var(--accent,#2c5364)}
    .kpi-card .sub{font-size:.75rem;color:#aaa;margin-top:4px}
    .kpi-card .change{font-size:.75rem;margin-top:6px;font-weight:600}
    .change.up{color:#27ae60}
    .change.down{color:#e74c3c}
    .change.flat{color:#999}

    /* Charts */
    .charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:24px;margin-bottom:32px}
    .chart-card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
    .chart-card h3{font-size:1rem;margin-bottom:16px;color:#333}
    .chart-card .na-msg{color:#bbb;font-size:.9rem;text-align:center;padding:40px 0}

    /* Top post */
    .top-post-section{margin-bottom:32px}
    .top-post-section h3{font-size:1.1rem;margin-bottom:16px;color:#333}
    .top-post-card{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);border-radius:14px;padding:24px;color:#fff;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
    .top-post-card img{width:160px;height:160px;border-radius:12px;object-fit:cover;flex-shrink:0}
    .top-post-card .top-info{flex:1;min-width:200px}
    .top-post-card .top-info h4{font-size:1rem;margin-bottom:8px;opacity:.8}
    .top-post-card .top-info .caption{font-size:.9rem;opacity:.9;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .top-post-card .top-stats{display:flex;gap:16px;flex-wrap:wrap}
    .top-post-card .top-stats span{font-size:.9rem;background:rgba(255,255,255,.15);padding:4px 12px;border-radius:20px}

    /* Posts */
    .posts-section h3{font-size:1.1rem;margin-bottom:16px;color:#333}
    .posts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
    .post-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);transition:transform .2s;text-decoration:none;color:inherit;display:block}
    .post-card:hover{transform:translateY(-3px);box-shadow:0 4px 20px rgba(0,0,0,.1)}
    .post-card img{width:100%;height:200px;object-fit:cover;display:block;background:#e8ecf0}
    .no-img{width:100%;height:200px;background:linear-gradient(135deg,#e8ecf0,#d5dbe0);display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:#bbb}
    .post-body{padding:14px}
    .caption{font-size:.82rem;color:#555;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px;min-height:2.4em}
    .post-meta{display:flex;gap:6px;flex-wrap:wrap}
    .post-meta span{font-size:.75rem;background:#f0f2f5;padding:3px 8px;border-radius:20px;color:#444}
    .post-meta span.highlight{background:#2c5364;color:#fff}
    .post-date{font-size:.7rem;color:#aaa;margin-top:8px;display:flex;justify-content:space-between;align-items:center}
    .media-badge{font-size:.65rem;background:#f0f2f5;padding:2px 6px;border-radius:4px;color:#666}

    .loading{text-align:center;padding:80px;color:#888;font-size:1.1rem}
    .err{background:#ffeaea;color:#c0392b;border-radius:10px;padding:16px;margin:20px 0}
    .toast{position:fixed;bottom:24px;right:24px;background:#333;color:#fff;padding:12px 24px;border-radius:10px;font-size:.9rem;z-index:999;display:none;box-shadow:0 4px 20px rgba(0,0,0,.3)}
    .toast.warn{background:#e67e22}
    .toast.ok{background:#27ae60}

    @media(max-width:600px){
      header{padding:14px 16px}
      main{padding:16px}
      .charts-grid{grid-template-columns:1fr}
      .profile-card{flex-direction:column;text-align:center}
      .top-post-card{flex-direction:column}
      .top-post-card img{width:100%;height:200px}
    }
  </style>
</head>
<body>
<header>
  <h1>📊 Finance Club Leipzig — KPI Dashboard</h1>
  <div class="right">
    <span id="lastFetch">Loading...</span>
    <span id="sourceBadge" class="source-badge"></span>
    <button class="btn-refresh" id="btnRefresh" onclick="doRefresh()">🔄 Refresh Data</button>
    <form method="POST" action="/logout" style="margin:0">
      <button class="btn-logout" type="submit">Logout</button>
    </form>
  </div>
</header>
<main id="app"><div class="loading">⏳ Loading Instagram data...</div></main>
<div class="toast" id="toast"></div>
<script>
/* ── Helpers ── */
function fmt(n){if(n==null||n===0)return'—';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n)}
function pct(n){return n!=null?n.toFixed(2)+'%':'—'}
function relDate(ts){if(!ts)return'';const d=Math.floor((Date.now()-new Date(ts).getTime())/86400000);if(d===0)return'Today';if(d===1)return'Yesterday';return d+' days ago'}

function showToast(msg,type='ok',ms=4000){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+type;t.style.display='block';
  setTimeout(()=>{t.style.display='none'},ms);
}

function timeData(ins,name){
  const m=(ins||[]).find(i=>i.name===name);
  if(!m||m._unavailable)return null;
  const v=m.values||[];
  if(v.length===0)return null;
  return{
    labels:v.map(x=>new Date(x.end_time).toLocaleDateString('de-DE',{day:'2-digit',month:'short'})),
    data:v.map(x=>x.value||0)
  };
}

function makeChart(id,label,td,color,type='line'){
  const el=document.getElementById(id);
  if(!el)return;
  if(!td){el.parentElement.querySelector('.na-msg')?.remove();const p=document.createElement('div');p.className='na-msg';p.textContent='Not available via scraping';el.style.display='none';el.parentElement.appendChild(p);return;}
  new Chart(el,{
    type,
    data:{labels:td.labels,datasets:[{label,data:td.data,borderColor:color,backgroundColor:color+'22',fill:type==='line',tension:.35,pointRadius:2,borderWidth:2}]},
    options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>label+': '+fmt(ctx.raw)}}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:10,font:{size:11}}},y:{beginAtZero:false,grid:{color:'#f5f5f5'},ticks:{font:{size:11}}}}}
  });
}

function makeBarChart(id,label,labels,data,color){
  const el=document.getElementById(id);
  if(!el)return;
  new Chart(el,{
    type:'bar',
    data:{labels,datasets:[{label,data,backgroundColor:color+'88',borderColor:color,borderWidth:1,borderRadius:6}]},
    options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{beginAtZero:true,grid:{color:'#f5f5f5'}}}}
  });
}

/* ── Main render ── */
function render(d){
  const{account:a,insights,posts,calculated_metrics:cm,lastFetch,source}=d;

  // Header
  document.getElementById('lastFetch').textContent='Updated: '+new Date(lastFetch).toLocaleString('de-DE');
  const badge=document.getElementById('sourceBadge');
  badge.textContent=source==='apify'?'🔗 Apify':source==='mock'?'🧪 Mock':'📡 Live';

  const followers=a?.followers_count||0;
  const following=a?.following_count||0;
  const mediaCount=a?.media_count||0;
  const engRate=cm?.engagement_rate||0;
  const avgLikes=cm?.avg_likes||0;
  const avgComments=cm?.avg_comments||0;

  // Follower growth from history
  const fcData=timeData(insights,'follower_count');
  let followerChange='';
  if(fcData&&fcData.data.length>=2){
    const diff=fcData.data[fcData.data.length-1]-fcData.data[0];
    const cls=diff>0?'up':diff<0?'down':'flat';
    const sign=diff>0?'+':'';
    followerChange=`<div class="change ${cls}">${sign}${diff} since tracking started</div>`;
  }

  // Find best post
  const sortedPosts=[...(posts||[])].sort((a,b)=>(b.insights?.engagement||0)-(a.insights?.engagement||0));
  const bestPost=sortedPosts[0];

  // Per-post engagement bars
  const postLabels=(posts||[]).map((p,i)=>{
    const d=p.timestamp?new Date(p.timestamp).toLocaleDateString('de-DE',{day:'2-digit',month:'short'}):`#${i+1}`;
    return d;
  });
  const postEngagement=(posts||[]).map(p=>(p.insights?.likes||0)+(p.insights?.comments||0));
  const postLikes=(posts||[]).map(p=>p.insights?.likes||0);
  const postComments=(posts||[]).map(p=>p.insights?.comments||0);

  // Total engagement across scraped posts
  const totalLikes=(posts||[]).reduce((s,p)=>s+(p.insights?.likes||0),0);
  const totalComments=(posts||[]).reduce((s,p)=>s+(p.insights?.comments||0),0);
  const totalVideoViews=(posts||[]).reduce((s,p)=>s+(p.insights?.video_views||0),0);

  // Posts HTML
  const postsHTML=(posts||[]).map(p=>{
    const img=p.thumbnail_url||p.media_url;
    const ins=p.insights||{};
    const eng=(ins.likes||0)+(ins.comments||0);
    const isBest=bestPost&&p.id===bestPost.id;
    return`<a class="post-card" href="${p.permalink||'#'}" target="_blank" rel="noopener">
      ${img?`<img src="${img}" alt="" loading="lazy" onerror="this.outerHTML='<div class=no-img>🖼️</div>'">`:`<div class="no-img">🖼️</div>`}
      <div class="post-body">
        <div class="caption">${p.caption||'(no caption)'}</div>
        <div class="post-meta">
          <span>❤️ ${fmt(ins.likes)}</span>
          <span>💬 ${fmt(ins.comments)}</span>
          ${ins.video_views?`<span>▶️ ${fmt(ins.video_views)}</span>`:''}
          <span${isBest?' class="highlight"':''}>🔥 ${fmt(eng)}</span>
        </div>
        <div class="post-date">
          <span>${relDate(p.timestamp)}</span>
          <span class="media-badge">${p.media_type||''}</span>
        </div>
      </div>
    </a>`;
  }).join('');

  // Best post HTML
  let bestPostHTML='';
  if(bestPost){
    const bi=bestPost.insights||{};
    const bimg=bestPost.thumbnail_url||bestPost.media_url;
    bestPostHTML=`
    <div class="top-post-section">
      <h3>🏆 Best Performing Post</h3>
      <a href="${bestPost.permalink||'#'}" target="_blank" class="top-post-card" style="text-decoration:none;color:#fff">
        ${bimg?`<img src="${bimg}" alt="" onerror="this.style.display='none'">`:''}
        <div class="top-info">
          <h4>Highest engagement from recent posts</h4>
          <div class="caption">${bestPost.caption||''}</div>
          <div class="top-stats">
            <span>❤️ ${fmt(bi.likes)} Likes</span>
            <span>💬 ${fmt(bi.comments)} Comments</span>
            ${bi.video_views?`<span>▶️ ${fmt(bi.video_views)} Views</span>`:''}
            <span>🔥 ${fmt((bi.likes||0)+(bi.comments||0))} Total</span>
          </div>
        </div>
      </a>
    </div>`;
  }

  document.getElementById('app').innerHTML=`
    <div class="profile-card">
      ${a?.profile_picture_url?`<img src="${a.profile_picture_url}" alt="" onerror="this.outerHTML='<div style=font-size:3rem>📸</div>'">`:`<div style="font-size:3rem">📸</div>`}
      <div class="info">
        <h2>@${a?.username||'—'}</h2>
        <p>${a?.biography||''}</p>
        ${a?.website?`<p><a href="${a.website}" target="_blank">${a.website}</a></p>`:''}
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card" style="--accent:#2c5364">
        <div class="label">Followers</div>
        <div class="value">${fmt(followers)}</div>
        <div class="sub">Total</div>
        ${followerChange}
      </div>
      <div class="kpi-card" style="--accent:#8e44ad">
        <div class="label">Following</div>
        <div class="value">${fmt(following)}</div>
        <div class="sub">Accounts</div>
      </div>
      <div class="kpi-card" style="--accent:#27ae60">
        <div class="label">Engagement Rate</div>
        <div class="value">${pct(engRate)}</div>
        <div class="sub">Avg per post / followers</div>
      </div>
      <div class="kpi-card" style="--accent:#e74c3c">
        <div class="label">Avg Likes</div>
        <div class="value">${fmt(Math.round(avgLikes))}</div>
        <div class="sub">Per post</div>
      </div>
      <div class="kpi-card" style="--accent:#f39c12">
        <div class="label">Avg Comments</div>
        <div class="value">${fmt(Math.round(avgComments))}</div>
        <div class="sub">Per post</div>
      </div>
      <div class="kpi-card" style="--accent:#0f2027">
        <div class="label">Total Posts</div>
        <div class="value">${fmt(mediaCount)}</div>
        <div class="sub">Published</div>
      </div>
      <div class="kpi-card" style="--accent:#2980b9">
        <div class="label">Total Likes</div>
        <div class="value">${fmt(totalLikes)}</div>
        <div class="sub">Last ${posts?.length||0} posts</div>
      </div>
      <div class="kpi-card" style="--accent:#16a085">
        <div class="label">Video Views</div>
        <div class="value">${fmt(totalVideoViews)}</div>
        <div class="sub">Last ${posts?.length||0} posts</div>
      </div>
    </div>

    ${bestPostHTML}

    <div class="charts-grid">
      <div class="chart-card">
        <h3>👥 Follower Count Over Time</h3>
        <canvas id="cFC"></canvas>
      </div>
      <div class="chart-card">
        <h3>📊 Engagement Rate Over Time</h3>
        <canvas id="cER"></canvas>
      </div>
      <div class="chart-card">
        <h3>❤️ Likes per Post</h3>
        <canvas id="cLikes"></canvas>
      </div>
      <div class="chart-card">
        <h3>💬 Comments per Post</h3>
        <canvas id="cComments"></canvas>
      </div>
    </div>

    <div class="posts-section">
      <h3>🗓 Recent Posts</h3>
      <div class="posts-grid">${postsHTML}</div>
    </div>
  `;

  /* Charts */
  const fcTD=timeData(insights,'follower_count');
  const erTD=timeData(insights,'engagement_rate');
  makeChart('cFC','Followers',fcTD,'#2c5364');
  makeChart('cER','Engagement Rate',erTD,'#27ae60');
  makeBarChart('cLikes','Likes',postLabels,postLikes,'#e74c3c');
  makeBarChart('cComments','Comments',postLabels,postComments,'#f39c12');
}

/* ── Data loading ── */
async function loadData(){
  try{
    const r=await fetch('/api/kpis');
    if(!r.ok)throw new Error('HTTP '+r.status);
    render(await r.json());
  }catch(e){
    document.getElementById('app').innerHTML=`<div class="err">❌ ${e.message}</div>`;
  }
}

async function doRefresh(){
  const btn=document.getElementById('btnRefresh');
  btn.disabled=true;
  btn.textContent='⏳ Scraping...';
  document.getElementById('lastFetch').textContent='⏳ Fetching fresh data from Instagram...';
  try{
    const r=await fetch('/api/refresh',{method:'POST'});
    const d=await r.json();
    if(r.status===429){
      showToast(d.error||'Already fetched today','warn');
      btn.textContent='🔄 Refresh Data';
      btn.disabled=false;
      return;
    }
    showToast('✅ Data refreshed successfully!','ok');
    await loadData();
  }catch(e){
    showToast('❌ Refresh failed: '+e.message,'warn');
  }
  btn.textContent='🔄 Refresh Data';
  btn.disabled=false;
}

loadData();
</script>
</body>
</html>
