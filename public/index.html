<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Club – Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0b0f1a;--surface:#141929;--surface2:#1a2138;--border:#1e2640;
    --text:#e0e0e0;--muted:#94a3b8;--accent:#6366f1;--accent2:#06b6d4;
    --ig:#e1306c;--li:#0077b5;
  }
  body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

  /* ── TOP BAR ── */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
  .topbar-left{display:flex;align-items:center;gap:1rem}
  .topbar-left a{color:var(--muted);text-decoration:none;font-size:.85rem;display:flex;align-items:center;gap:.3rem;transition:color .2s}
  .topbar-left a:hover{color:var(--text)}
  .topbar-title{font-weight:700;font-size:1.05rem}
  .topbar-right{display:flex;align-items:center;gap:.75rem}

  /* ── PLATFORM TABS ── */
  .platform-tabs{display:flex;gap:.5rem}
  .ptab{padding:.4rem 1rem;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:all .2s}
  .ptab.active-ig{background:var(--ig);color:#fff;border-color:var(--ig)}
  .ptab.active-li{background:var(--li);color:#fff;border-color:var(--li)}
  .ptab:not([class*="active-"]):hover{border-color:#475569;color:var(--text)}

  /* ── BUTTONS ── */
  .btn{padding:.4rem 1rem;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:all .2s}
  .btn:hover{border-color:#475569;color:var(--text)}
  .btn-refresh{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-refresh:hover{opacity:.85}
  .btn-refresh:disabled{opacity:.4;cursor:not-allowed}

  /* ── LAYOUT ── */
  .container{max-width:1280px;margin:0 auto;padding:1.5rem}
  .status-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:.5rem}
  .status-bar .last-fetch{font-size:.78rem;color:var(--muted)}

  /* ── PROFILE ROW ── */
  .profile-row{display:flex;align-items:center;gap:1.25rem;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.25rem 1.5rem;margin-bottom:1.5rem}
  .profile-pic{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--border)}
  .profile-info h2{font-size:1.15rem;font-weight:700}
  .profile-info p{font-size:.82rem;color:var(--muted);margin-top:.15rem;max-width:600px}

  /* ── KPI CARDS ── */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin-bottom:1.5rem}
  .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.2rem}
  .kpi-card .label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.35rem}
  .kpi-card .value{font-size:1.65rem;font-weight:700}
  .kpi-card .sub{font-size:.72rem;color:var(--muted);margin-top:.2rem}

  /* ── CHART ── */
  .chart-section{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.25rem 1.5rem;margin-bottom:1.5rem}
  .chart-section h3{font-size:.95rem;font-weight:600;margin-bottom:1rem}
  .chart-wrap{position:relative;height:280px}

  /* ── POSTS ── */
  .posts-section h3{font-size:1rem;font-weight:600;margin-bottom:1rem}
  .posts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
  .post-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .2s}
  .post-card:hover{border-color:#475569}
  .post-img{width:100%;height:200px;object-fit:cover;background:var(--surface2)}
  .post-body{padding:1rem}
  .post-body .caption{font-size:.82rem;color:var(--muted);margin-bottom:.6rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .post-stats{display:flex;gap:1rem;font-size:.78rem;flex-wrap:wrap}
  .post-stats span{display:flex;align-items:center;gap:.25rem}
  .post-date{font-size:.7rem;color:#64748b;margin-top:.5rem}
  .badge{display:inline-block;font-size:.65rem;padding:.15rem .5rem;border-radius:6px;font-weight:600;margin-bottom:.4rem}
  .badge-ig{background:rgba(225,48,108,.15);color:#e1306c}
  .badge-li{background:rgba(0,119,181,.15);color:#0077b5}

  /* ── TOAST ── */
  .toast{position:fixed;bottom:1.5rem;right:1.5rem;background:#1e293b;color:#e0e0e0;padding:.75rem 1.25rem;border-radius:10px;font-size:.82rem;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none;z-index:200}
  .toast.show{opacity:1;transform:translateY(0)}

  /* ── LOADING ── */
  .loading-overlay{position:fixed;inset:0;background:rgba(11,15,26,.85);display:flex;align-items:center;justify-content:center;z-index:300}
  .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hidden{display:none!important}
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-overlay" id="loader"><div class="spinner"></div></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-left">
    <a href="/menu.html">← Menu</a>
    <span class="topbar-title" id="topTitle">Dashboard</span>
  </div>
  <div class="topbar-right">
    <div class="platform-tabs">
      <button class="ptab" id="tabIG" onclick="switchPlatform('instagram')">📸 Instagram</button>
      <button class="ptab" id="tabLI" onclick="switchPlatform('linkedin')">💼 LinkedIn</button>
    </div>
    <button class="btn btn-refresh" id="btnRefresh" onclick="doRefresh()">↻ Refresh</button>
    <form method="POST" action="/logout" style="display:inline"><button class="btn" type="submit">Log out</button></form>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="container">
  <div class="status-bar">
    <span class="last-fetch" id="lastFetch"></span>
    <span class="last-fetch" id="sourceTag"></span>
  </div>

  <!-- PROFILE -->
  <div class="profile-row" id="profileRow">
    <img class="profile-pic" id="profilePic" src="" alt="">
    <div class="profile-info">
      <h2 id="profileName"></h2>
      <p id="profileBio"></p>
    </div>
  </div>

  <!-- KPIs -->
  <div class="kpi-grid" id="kpiGrid"></div>

  <!-- CHART -->
  <div class="chart-section">
    <h3 id="chartTitle">Followers Over Time</h3>
    <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
  </div>

  <!-- POSTS -->
  <div class="posts-section">
    <h3 id="postsTitle">Recent Posts</h3>
    <div class="posts-grid" id="postsGrid"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════ */
/*  STATE                                                                     */
/* ═══════════════════════════════════════════════════════════════════════════ */
let platform = 'instagram';          // 'instagram' | 'linkedin'
let igData   = null;
let liData   = null;
let chart    = null;

/* ── Init ── */
(async () => {
  const params = new URLSearchParams(location.search);
  platform = params.get('platform') === 'linkedin' ? 'linkedin' : 'instagram';
  await loadData();
  render();
  hide('loader');
})();

/* ═══════════════════════════════════════════════════════════════════════════ */
/*  DATA                                                                      */
/* ═══════════════════════════════════════════════════════════════════════════ */
async function loadData() {
  try {
    if (platform === 'instagram' && !igData) {
      igData = await (await fetch('/api/kpis')).json();
    }
    if (platform === 'linkedin' && !liData) {
      liData = await (await fetch('/api/linkedin/kpis')).json();
    }
  } catch (e) { toast('Failed to load data: ' + e.message); }
}

/* ═══════════════════════════════════════════════════════════════════════════ */
/*  RENDER                                                                    */
/* ═══════════════════════════════════════════════════════════════════════════ */
function render() {
  // Tabs
  document.getElementById('tabIG').className = 'ptab' + (platform === 'instagram' ? ' active-ig' : '');
  document.getElementById('tabLI').className = 'ptab' + (platform === 'linkedin'  ? ' active-li' : '');

  if (platform === 'instagram') renderIG();
  else renderLI();
}

/* ── Instagram ── */
function renderIG() {
  const d = igData; if (!d) return;
  const a = d.account || {};
  const m = d.calculated_metrics || {};

  document.getElementById('topTitle').textContent = 'Instagram Dashboard';
  document.getElementById('lastFetch').textContent = d.lastFetch ? 'Last updated: ' + new Date(d.lastFetch).toLocaleString() : '';
  document.getElementById('sourceTag').textContent = d.source === 'mock' ? '⚠ Mock data' : '';

  // Profile
  document.getElementById('profilePic').src = a.profile_picture_url || '';
  document.getElementById('profileName').textContent = '@' + (a.username || '');
  document.getElementById('profileBio').textContent = a.biography || '';

  // KPIs
  document.getElementById('kpiGrid').innerHTML = kpiCard('Followers', fmt(a.followers_count)) +
    kpiCard('Following', fmt(a.following_count)) +
    kpiCard('Posts', fmt(a.media_count)) +
    kpiCard('Engagement Rate', m.engagement_rate != null ? m.engagement_rate + '%' : '—') +
    kpiCard('Avg Likes', fmt(m.avg_likes)) +
    kpiCard('Avg Comments', fmt(m.avg_comments));

  // Chart
  const fSeries = (d.insights || []).find(i => i.name === 'follower_count');
  document.getElementById('chartTitle').textContent = 'Followers Over Time';
  buildChart(fSeries ? fSeries.values : [], 'Followers', '#e1306c');

  // Posts
  document.getElementById('postsTitle').textContent = `Recent Posts (${(d.posts||[]).length})`;
  document.getElementById('postsGrid').innerHTML = (d.posts || []).map(p => {
    const img = p.local_image || p.media_url || '';
    const ins = p.insights || {};
    return `<div class="post-card">
      ${img ? `<img class="post-img" src="${esc(img)}" alt="" loading="lazy">` : ''}
      <div class="post-body">
        <span class="badge badge-ig">${esc(p.media_type||'POST')}</span>
        <div class="caption">${esc(p.caption||'')}</div>
        <div class="post-stats">
          <span>❤️ ${fmt(ins.likes)}</span>
          <span>💬 ${fmt(ins.comments)}</span>
          ${ins.video_views ? `<span>▶️ ${fmt(ins.video_views)}</span>` : ''}
        </div>
        <div class="post-date">${fmtDate(p.timestamp)}</div>
      </div>
    </div>`;
  }).join('');
}

/* ── LinkedIn ── */
function renderLI() {
  const d = liData; if (!d) return;
  const c = d.company || {};
  const m = d.calculated_metrics || {};

  document.getElementById('topTitle').textContent = 'LinkedIn Dashboard';
  document.getElementById('lastFetch').textContent = d.lastFetch ? 'Last updated: ' + new Date(d.lastFetch).toLocaleString() : '';
  document.getElementById('sourceTag').textContent = d.source === 'mock' ? '⚠ Mock data' : (d._fallback ? '⚠ Cached data' : '');

  // Profile
  document.getElementById('profilePic').src = c.logo_url || '';
  document.getElementById('profileName').textContent = c.name || '';
  document.getElementById('profileBio').textContent = c.description ? c.description.slice(0, 200) : '';

  // KPIs
  document.getElementById('kpiGrid').innerHTML = kpiCard('Followers', fmt(c.followers_count)) +
    kpiCard('Employees on LI', fmt(c.employees_on_linkedin)) +
    kpiCard('Engagement Rate', m.engagement_rate != null ? m.engagement_rate + '%' : '—') +
    kpiCard('Avg Likes', fmt(m.avg_likes)) +
    kpiCard('Avg Comments', fmt(m.avg_comments)) +
    kpiCard('Avg Shares', fmt(m.avg_shares));

  // Chart
  const fSeries = (d.insights || []).find(i => i.name === 'followers');
  document.getElementById('chartTitle').textContent = 'Followers Over Time';
  buildChart(fSeries ? fSeries.values : [], 'Followers', '#0077b5');

  // Posts
  document.getElementById('postsTitle').textContent = `Recent Posts (${(d.posts||[]).length})`;
  document.getElementById('postsGrid').innerHTML = (d.posts || []).map(p => {
    const img = p.local_image || p.image_url || '';
    return `<div class="post-card">
      ${img ? `<img class="post-img" src="${esc(img)}" alt="" loading="lazy">` : ''}
      <div class="post-body">
        <span class="badge badge-li">LinkedIn Post</span>
        <div class="caption">${esc(p.text||'')}</div>
        <div class="post-stats">
          <span>👍 ${fmt(p.num_likes)}</span>
          <span>💬 ${fmt(p.num_comments)}</span>
          <span>🔁 ${fmt(p.num_shares)}</span>
          ${p.num_impressions ? `<span>👁 ${fmt(p.num_impressions)}</span>` : ''}
        </div>
        <div class="post-date">${fmtDate(p.timestamp)}</div>
      </div>
    </div>`;
  }).join('');
}

/* ═══════════════════════════════════════════════════════════════════════════ */
/*  CHART                                                                     */
/* ═══════════════════════════════════════════════════════════════════════════ */
function buildChart(values, label, color) {
  if (chart) { chart.destroy(); chart = null; }
  const ctx = document.getElementById('mainChart').getContext('2d');
  const labels = (values || []).map(v => {
    const d = new Date(v.end_time);
    return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short' });
  });
  const data = (values || []).map(v => v.value);

  chart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: [{ label, data, borderColor: color, backgroundColor: color + '22', fill: true, tension: .35, pointRadius: 2 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#64748b', maxTicksLimit: 10 }, grid: { color: '#1e2640' } },
        y: { ticks: { color: '#64748b' }, grid: { color: '#1e2640' } },
      },
    },
  });
}

/* ═══════════════════════════════════════════════════════════════════════════ */
/*  ACTIONS                                                                   */
/* ═══════════════════════════════════════════════════════════════════════════ */
async function switchPlatform(p) {
  platform = p;
  history.replaceState(null, '', '?platform=' + p);
  show('loader');
  await loadData();
  render();
  hide('loader');
}

async function doRefresh() {
  const btn = document.getElementById('btnRefresh');
  btn.disabled = true; btn.textContent = '↻ Refreshing…';
  try {
    const ep = platform === 'instagram' ? '/api/refresh' : '/api/linkedin/refresh';
    const res = await fetch(ep, { method: 'POST' });
    const json = await res.json();
    if (!res.ok) { toast(json.error || 'Refresh failed'); return; }
    // reload data
    if (platform === 'instagram') { igData = await (await fetch('/api/kpis')).json(); }
    else { liData = await (await fetch('/api/linkedin/kpis')).json(); }
    render();
    toast('Data refreshed ✓');
  } catch (e) { toast('Error: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = '↻ Refresh'; }
}

/* ═══════════════════════════════════════════════════════════════════════════ */
/*  HELPERS                                                                   */
/* ═══════════════════════════════════════════════════════════════════════════ */
function kpiCard(label, value, sub) {
  return `<div class="kpi-card"><div class="label">${label}</div><div class="value">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
}
function fmt(n) { return n != null ? Number(n).toLocaleString('en-US') : '—'; }
function fmtDate(ts) { if (!ts) return ''; return new Date(ts).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }); }
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3500); }
function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }
</script>
</body>
</html>
