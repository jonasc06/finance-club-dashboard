<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Finance Club Leipzig – KPI Dashboard</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);min-height:100vh;display:flex;flex-direction:column;color:#fff}
    header{padding:18px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
    header h1{font-size:1.3rem}
    .btn-logout{padding:8px 16px;background:transparent;color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.2);border-radius:8px;cursor:pointer;font-size:.8rem}
    .btn-logout:hover{background:rgba(255,255,255,.08)}
    main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
    .logo{font-size:3rem;margin-bottom:8px}
    .title{font-size:1.6rem;font-weight:700;margin-bottom:4px}
    .subtitle{font-size:.95rem;opacity:.7;margin-bottom:48px}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;width:100%;max-width:1080px}
    .platform-card{background:rgba(255,255,255,.08);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:32px 28px;text-decoration:none;color:#fff;transition:all .25s;cursor:pointer;display:flex;flex-direction:column;gap:16px}
    .platform-card:hover{background:rgba(255,255,255,.15);transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.3)}
    .platform-header{display:flex;align-items:center;gap:14px}
    .platform-icon{font-size:2.2rem}
    .platform-name{font-size:1.2rem;font-weight:700}
    .platform-tag{font-size:.7rem;background:rgba(255,255,255,.15);padding:3px 10px;border-radius:20px;margin-left:auto}
    .kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .mini-kpi{text-align:center}
    .mini-kpi .val{font-size:1.4rem;font-weight:700}
    .mini-kpi .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;opacity:.6;margin-top:2px}
    .platform-footer{font-size:.75rem;opacity:.5;margin-top:4px}
    .view-link{font-size:.85rem;font-weight:600;opacity:.8;display:flex;align-items:center;gap:6px;margin-top:4px}
    .view-link:hover{opacity:1}
    .loading-mini{font-size:.85rem;opacity:.5;text-align:center;padding:12px 0}
    @media(max-width:600px){
      main{padding:24px 16px}
      .cards{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<header>
  <h1>📊 Finance Club Leipzig — KPI Dashboard</h1>
  <form method="POST" action="/logout" style="margin:0">
    <button class="btn-logout" type="submit">Logout</button>
  </form>
</header>
<main>
  <div class="logo">📊</div>
  <div class="title">KPI Dashboard</div>
  <div class="subtitle">Select a platform to view detailed analytics</div>
  <div class="cards">

    <a href="/instagram" class="platform-card" id="igCard">
      <div class="platform-header">
        <span class="platform-icon">📸</span>
        <span class="platform-name">Instagram</span>
        <span class="platform-tag">Social</span>
      </div>
      <div id="igKpis" class="loading-mini">Loading...</div>
      <div class="view-link">View Dashboard →</div>
    </a>

    <a href="/linkedin" class="platform-card" id="liCard">
      <div class="platform-header">
        <span class="platform-icon">💼</span>
        <span class="platform-name">LinkedIn</span>
        <span class="platform-tag">Professional</span>
      </div>
      <div id="liKpis" class="loading-mini">Loading...</div>
      <div class="view-link">View Dashboard →</div>
    </a>

    <a href="/easyverein" class="platform-card" id="evCard">
      <div class="platform-header">
        <span class="platform-icon">🏢</span>
        <span class="platform-name">EasyVerein</span>
        <span class="platform-tag">Members & Finance</span>
      </div>
      <div id="evKpis" class="loading-mini">Loading...</div>
      <div class="view-link">View Dashboard →</div>
    </a>

  </div>
</main>
<script>
function fmt(n){if(n==null||n===0)return'\u2014';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n)}
function pct(n){return n!=null?n.toFixed(2)+'%':'\u2014'}

function eur(n){if(n==null)return'\u2014';return n.toLocaleString('de-DE',{style:'currency',currency:'EUR'})}

function renderCard(el,data,type){
  var a=data.account||{};
  var cm=data.calculated_metrics||{};
  var lastFetch=data.lastFetch;

  if(type==='ev'){
    var m=data.members||{};
    var inv=data.invoices||{};
    el.innerHTML=
      '<div class="kpi-row">'+
      '<div class="mini-kpi"><div class="val">'+fmt(cm.active_members||m.total)+'</div><div class="lbl">Members</div></div>'+
      '<div class="mini-kpi"><div class="val">'+eur(cm.total_revenue||inv.total_revenue)+'</div><div class="lbl">Revenue</div></div>'+
      '<div class="mini-kpi"><div class="val">'+fmt(cm.open_invoices||inv.open_count)+'</div><div class="lbl">Open Inv.</div></div>'+
      '</div>';
  } else {
    var followers,engRate,posts;
    if(type==='ig'){
      followers=a.followers_count||0;
      engRate=cm.engagement_rate||0;
      posts=a.media_count||0;
    }else{
      followers=a.followers_count||0;
      engRate=cm.engagement_rate||0;
      posts=cm.posts_scraped||0;
    }
    el.innerHTML=
      '<div class="kpi-row">'+
      '<div class="mini-kpi"><div class="val">'+fmt(followers)+'</div><div class="lbl">Followers</div></div>'+
      '<div class="mini-kpi"><div class="val">'+pct(engRate)+'</div><div class="lbl">Eng. Rate</div></div>'+
      '<div class="mini-kpi"><div class="val">'+fmt(posts)+'</div><div class="lbl">Posts</div></div>'+
      '</div>';
  }

  /* Add footer after the kpi row */
  var footer=document.createElement('div');
  footer.className='platform-footer';
  footer.textContent='Last updated: '+(lastFetch?new Date(lastFetch).toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'never');
  el.after(footer);
}

async function loadCard(url,elId,type){
  try{
    var r=await fetch(url);
    if(!r.ok)throw new Error('HTTP '+r.status);
    var d=await r.json();
    renderCard(document.getElementById(elId),d,type);
  }catch(e){
    document.getElementById(elId).innerHTML='<span style="opacity:.5">No data yet</span>';
  }
}

loadCard('/api/kpis','igKpis','ig');
loadCard('/api/linkedin/kpis','liKpis','li');
loadCard('/api/easyverein/kpis','evKpis','ev');
</script>
</body>
</html>
